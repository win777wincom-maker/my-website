<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MATRIX OS - 全息指挥中枢</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Orbitron', 'Share Tech Mono', system-ui; }
        :root {
            --bg-deep: #010514;
            --bg-surface: rgba(6, 16, 32, 0.75);
            --primary-glow: #00f0ff;
            --border-aura: rgba(0, 240, 255, 0.6);
            --text-bright: #eef5ff;
            --text-dim: #8db3e0;
            --card-bg: rgba(4, 12, 24, 0.6);
            --danger-neon: #ff2a6d;
            --success-glow: #39ff14;
            --gradient-1: #002288;
            --gradient-2: #00f2ff;
            --glass-blur: 16px;
            --modal-bg: rgba(2, 10, 22, 0.95);
            --title-color: #00f0ff;
        }
        body.theme-light {
            --bg-deep: #eef2ff;
            --bg-surface: rgba(255, 255, 255, 0.75);
            --primary-glow: #0077ff;
            --border-aura: #3b82f6;
            --text-bright: #0a0a2a;
            --text-dim: #2c3e66;
            --card-bg: rgba(255, 255, 255, 0.7);
            --modal-bg: rgba(240, 245, 255, 0.96);
            --gradient-1: #82b4ff;
            --gradient-2: #d4f0ff;
            --title-color: #0077ff;
        }
        body { background-color: var(--bg-deep); color: var(--text-bright); font-size: 14px; height: 100vh; overflow: hidden; transition: background 0.4s, color 0.4s; }
        
        /* 纯净动态极光渐变背景，无网格 */
        .aurora-field { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: linear-gradient(135deg, var(--bg-deep), var(--gradient-1), var(--gradient-2), var(--bg-deep)); 
            background-size: 300% 300%;
            animation: aurora-flow 12s ease-in-out infinite;
            opacity: 0.9; 
            transition: background 0.4s; 
        }
        @keyframes aurora-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 高级极光动态边框 - 适用于所有边框需求 */
        .dynamic-border {
            border: 1px solid var(--border-aura);
            animation: borderPulse 3s infinite alternate;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        @keyframes borderPulse {
            0% { border-color: var(--border-aura); box-shadow: 0 0 5px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0,0,0,0.3); }
            100% { border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5), inset 0 0 10px rgba(0,0,0,0.5); }
        }

        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--primary-glow); border-radius: 10px; }
        
        .glass-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; backdrop-filter: blur(var(--glass-blur)); background: var(--bg-surface); z-index: 100; border-bottom: 1px solid var(--primary-glow);}
        .logo-area { display: flex; gap: 20px; align-items: center; }
        .neon-text { font-size: 1.4rem; font-weight: 800; letter-spacing: 3px; color: var(--title-color); text-shadow: 0 0 15px var(--title-color); transition: color 0.3s; }
        
        .hud-btn { background: var(--bg-surface); border: 1px solid var(--border-aura); color: var(--primary-glow); padding: 6px 16px; cursor: pointer; border-radius: 20px; transition: 0.3s; font-weight: bold; backdrop-filter: blur(4px); }
        .hud-btn:hover, .hud-btn.active { background: var(--primary-glow); color: #fff; box-shadow: 0 0 15px var(--primary-glow); border-color: transparent;}
        
        .search-box { background: rgba(0,0,0,0.4); border: 1px solid var(--border-aura); color: var(--text-bright); padding: 6px 12px; border-radius: 20px; outline: none; width: 220px; transition: 0.3s; }
        .search-box:focus { border-color: var(--primary-glow); box-shadow: 0 0 10px var(--primary-glow); }

        /* 旋转齿轮 */
        .gear-icon { font-size: 1.2rem; cursor: pointer; display: inline-block; transition: 0.3s; color: var(--primary-glow); }
        .gear-icon:hover { animation: spin 2s linear infinite; text-shadow: 0 0 15px var(--primary-glow); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .dashboard { display: flex; height: calc(100vh - 68px); overflow: hidden; position: relative;}
        .side-panel { width: 260px; backdrop-filter: blur(var(--glass-blur)); background: var(--bg-surface); padding: 20px 12px; overflow-y: auto; transition: transform 0.3s, margin 0.3s; z-index: 10;}
        .right-panel { width: 400px; }
        .hidden-left { transform: translateX(-100%); margin-left: -260px; }
        .hidden-right { transform: translateX(100%); margin-right: -400px; }
        .main-stage { flex: 1; padding: 20px; overflow-y: auto; position: relative; background: transparent;}
        
        .section-title { font-size: 1.1rem; border-left: 4px solid var(--primary-glow); padding-left: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; color: var(--text-bright); text-shadow: 0 0 5px var(--primary-glow);}
        
        .site-menu-item { display: flex; flex-direction: column; margin-bottom: 8px; }
        .site-shifts { display: none; padding-left: 20px; margin-top: 8px; gap: 6px; flex-direction: column; }
        .site-shifts.active { display: flex; }
        .shift-btn { font-size: 0.8rem; background: rgba(0,0,0,0.2); border: 1px dashed var(--border-aura); color: var(--text-bright); padding: 6px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: left;}
        .shift-btn:hover { background: var(--primary-glow); color: #fff; border-style: solid; box-shadow: 0 0 8px var(--primary-glow);}

        /* 数据仪表盘卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); backdrop-filter: blur(4px); border: 1px solid var(--border-aura); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 0 15px var(--primary-glow); background: var(--bg-surface); }
        .stat-card-title { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 6px; }
        .stat-card-value { font-size: 1.4rem; font-weight: bold; color: var(--primary-glow); }

        .hierarchy-group { margin-bottom: 28px; }
        .group-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; background: rgba(0,240,255,0.15); display: inline-block; padding: 4px 14px; border-radius: 20px; margin-bottom: 12px; backdrop-filter: blur(4px); border-left: 2px solid var(--primary-glow); color: var(--text-bright);}
        
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
        .staff-list { display: flex; flex-direction: column; gap: 10px; }
        .staff-tree { padding-left: 20px; border-left: 1px dashed var(--border-aura); display: flex; flex-direction: column; gap: 8px;}
        
        .staff-card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.3s; position: relative;}
        .staff-card:hover { transform: translateY(-5px); }
        .staff-card.list-mode { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-radius: 8px; }
        .staff-card.tree-mode { display: inline-block; width: fit-content; padding: 6px 12px; border-radius: 6px; }

        .card-site { font-size: 0.65rem; color: var(--primary-glow); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .staff-name { font-size: 1.2rem; font-weight: bold; display: flex; align-items: baseline; gap: 8px; margin: 8px 0; color: var(--text-bright); }
        .staff-role { font-size: 0.7rem; background: rgba(0,240,255,0.2); border: 1px solid var(--border-aura); display: inline-block; padding: 2px 10px; border-radius: 14px; color: var(--text-bright); }
        .staff-meta { margin-top: 12px; font-size: 0.75rem; display: flex; justify-content: space-between; color: var(--text-dim); }

        .holo-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .holo-dialog { width: 600px; max-width: 95%; background: var(--modal-bg); border-radius: 20px; padding: 28px; box-shadow: 0 0 40px rgba(0,240,255,0.2); animation: floatIn 0.3s ease; position: relative; color: var(--text-bright);}
        @keyframes floatIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
        .stat-value-text { font-size: 0.95rem; font-weight: 500; word-break: break-all; }
        
        .tech-input, select { background: rgba(0,0,0,0.5); border: 1px solid var(--border-aura); color: var(--text-bright); padding: 10px; border-radius: 8px; width: 100%; outline: none; transition: 0.3s; margin-bottom: 5px; }
        .tech-input:focus, select:focus { border-color: var(--primary-glow); box-shadow: 0 0 10px rgba(0,240,255,0.5); }
        .tech-btn { background: rgba(0,0,0,0.4); border: 1px solid var(--primary-glow); color: var(--primary-glow); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
        .tech-btn:hover { background: var(--primary-glow); color: #fff; box-shadow: 0 0 15px var(--primary-glow); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* 设置面板 Tab */
        .tab-headers { display: flex; gap: 10px; border-bottom: 1px solid var(--border-aura); margin-bottom: 15px; padding-bottom: 10px; }
        .tab-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 1rem; padding: 5px 10px; transition: 0.3s;}
        .tab-btn.active { color: var(--primary-glow); border-bottom: 2px solid var(--primary-glow); text-shadow: 0 0 8px var(--primary-glow); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .color-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; color: var(--text-bright); }
    </style>
</head>
<body>
<div class="aurora-field" id="auroraBg"></div>

<div id="loginOverlay" class="holo-overlay" style="display: flex; z-index: 3000;">
    <div class="holo-dialog dynamic-border" style="text-align:center; width: 400px;">
        <h2 style="color:var(--primary-glow); margin-bottom: 5px;">MATRIX OS</h2>
        <p style="color:var(--text-dim); margin-bottom: 20px; font-size: 0.85rem;">QUANTUM AUTHENTICATION</p>
        <input type="email" id="loginEmail" class="tech-input dynamic-border" style="margin-bottom:15px;" placeholder="管理邮箱">
        <input type="password" id="loginPwd" class="tech-input dynamic-border" style="margin-bottom:25px;" placeholder="访问密匙">
        <button class="tech-btn dynamic-border" id="verifyLoginBtn" style="width: 100%; padding: 12px; font-size: 1.1rem;" onclick="verifyLogin()">接入中枢系统</button>
    </div>
</div>

<div id="settingsOverlay" class="holo-overlay" style="z-index: 2500;">
    <div class="holo-dialog dynamic-border" style="width: 700px; max-width: 95%;">
        <h3 style="color:var(--primary-glow); margin-bottom: 15px;">⚙️ 中枢参数设定</h3>
        <div class="tab-headers">
            <button class="tab-btn active" onclick="switchTab('tab-profile')">个人设定</button>
            <button class="tab-btn" onclick="switchTab('tab-theme')">极光主题</button>
            <button class="tab-btn admin-only" onclick="switchTab('tab-sites')" style="display:none;">站点管控</button>
            <button class="tab-btn admin-only" onclick="switchTab('tab-admins')" style="display:none;">权限中枢</button>
        </div>
        
        <div style="max-height: 50vh; overflow-y: auto; padding-right: 10px;">
            <div id="tab-profile" class="tab-content active">
                <input type="text" id="set_nickname" class="tech-input dynamic-border" placeholder="修改显示昵称">
                <input type="password" id="set_pwd" class="tech-input dynamic-border" placeholder="新访问密匙 (不修改请留空)" style="margin-top:10px;">
                <button class="tech-btn" style="margin-top:15px; width:100%;" onclick="updateProfile()">保存个人配置</button>
                <button class="tech-btn" style="margin-top:15px; width:100%; border-color:var(--danger-neon); color:var(--danger-neon);" onclick="logout()">🛑 登出系统</button>
            </div>
            
            <div id="tab-theme" class="tab-content">
                <div class="color-row"><span>中枢标语 (Title)</span><input type="text" id="customTitle" class="tech-input" style="width: 250px;"></div>
                <div class="color-row"><span>标语霓虹色</span><input type="color" id="customTitleColor" class="tech-input" style="width: 100px;"></div>
                <div class="color-row"><span>主控发光色 (Primary)</span><input type="color" id="customPrimary" class="tech-input" style="width: 100px;"></div>
                <div class="color-row"><span>极光背景色A</span><input type="color" id="customGradStart" class="tech-input" style="width: 100px;"></div>
                <div class="color-row"><span>极光背景色B</span><input type="color" id="customGradEnd" class="tech-input" style="width: 100px;"></div>
                <div class="color-row"><span>动态边框脉冲色</span><input type="color" id="customBorder" class="tech-input" style="width: 100px;"></div>
                <div style="display:flex; gap: 10px; margin-top:20px;">
                    <button class="tech-btn" style="flex:1;" onclick="setThemePreset('dark')">🌙 暗夜预设</button>
                    <button class="tech-btn" style="flex:1;" onclick="setThemePreset('light')">☀️ 昼明预设</button>
                </div>
                <button class="tech-btn dynamic-border" style="margin-top:15px; width:100%;" onclick="saveUserTheme()">💾 应用并保存视觉协议</button>
            </div>

            <div id="tab-sites" class="tab-content admin-only">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="newSiteInput" class="tech-input dynamic-border" placeholder="输入新站点名称">
                    <button class="tech-btn dynamic-border" onclick="addSite()">➕ 添加站点</button>
                </div>
                <div id="settingsSiteList" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>

            <div id="tab-admins" class="tab-content admin-only">
                <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center;">
                    <input type="email" id="newAdminEmail" class="tech-input dynamic-border" placeholder="新管理员邮箱">
                    <input type="password" id="newAdminPwd" class="tech-input dynamic-border" placeholder="初始密码">
                    <button class="tech-btn dynamic-border" onclick="addAdmin()">授权</button>
                </div>
                <div id="settingsAdminList" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>
        <button class="tech-btn" style="margin-top: 20px; float: right;" onclick="closeSettings()">关闭面板</button>
        <div style="clear:both;"></div>
    </div>
</div>

<header class="glass-header dynamic-border">
    <div class="logo-area">
        <button class="hud-btn" onclick="togglePanel('leftPanel')">◧ 站点阵列</button>
        <span class="neon-text" id="mainTitle">MATRIX OS · 全息指挥中枢</span>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <input type="text" id="searchInput" class="search-box dynamic-border" placeholder="🔍 搜索工号/姓名..." onkeyup="handleSearch()">
        <button class="hud-btn" onclick="cycleLayout()">👁️ 切换形态</button>
        <button class="hud-btn" id="navStaffBtn" onclick="showDashboardView()">🌌 数据大盘</button>
        <button class="hud-btn" id="navGlobalBtn" onclick="showGlobalView()">🌐 全站列表</button>
        <button class="hud-btn admin-only" style="display:none;" onclick="togglePanel('rightPanel')">录入终端 ◨</button>
        <span class="gear-icon" onclick="openSettings()">⚙️</span>
    </div>
</header>

<div class="dashboard">
    <div class="side-panel dynamic-border" id="leftPanel">
        <div class="section-title">🚀 部署矩阵</div>
        <div id="siteList" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
    
    <div class="main-stage" id="mainStage">
        <div id="statsDashboardArea" style="display:block;">
            <div class="section-title">📊 矩阵人员分布雷达</div>
            <div class="stats-grid" id="dashboardStatsGrid"></div>
            <div class="section-title" style="margin-top: 20px;">⏱️ 矩阵服役时长勘测</div>
            <div class="stats-grid" id="tenureStatsGrid"></div>
        </div>
        
        <div id="staffViewArea" style="display:none;">
            <div class="section-title">
                <span id="currentViewTitle">👥 全息员工档案</span>
                <span id="resetFilterBtn" style="cursor:pointer; font-size:12px; display:none; background:var(--primary-glow); color:#000; padding:2px 8px; border-radius:10px;" onclick="resetToFullView()">↺ 撤销过滤</span>
            </div>
            <div id="hierarchyContainer"></div>
        </div>
    </div>
    
    <div class="side-panel right-panel hidden-right dynamic-border" id="rightPanel">
        <div class="section-title" style="color:var(--primary-glow);">⚡ 神经末梢录入</div>
        <div class="form-grid" id="editorForm">
            <input type="text" id="f_id" placeholder="工号*" class="tech-input dynamic-border">
            <input type="text" id="f_name" placeholder="姓名*" class="tech-input dynamic-border">
            <select id="f_gender" class="tech-input dynamic-border"><option>男</option><option>女</option></select>
            <input type="text" id="f_pos" placeholder="岗位" class="tech-input dynamic-border">
            <select id="f_dept" class="tech-input dynamic-border" id="f_dept_select"><option value="">选择站点</option></select>
            <select id="f_shift" class="tech-input dynamic-border"><option>A班</option><option>B班</option><option>全班</option></select>
            <input type="text" id="f_manager" placeholder="上司工号" class="tech-input dynamic-border">
            <input type="text" id="f_email" placeholder="邮箱" class="tech-input dynamic-border">
            <div style="display:flex; flex-direction:column;"><label style="font-size:10px;color:var(--text-dim);">入职日期</label><input type="date" id="f_hire" class="tech-input dynamic-border"></div>
            <div style="display:flex; flex-direction:column;"><label style="font-size:10px;color:var(--text-dim);">出生日期</label><input type="date" id="f_dob" class="tech-input dynamic-border"></div>
            <input type="text" id="f_nation" placeholder="国籍" class="tech-input dynamic-border">
            <input type="text" id="f_office" placeholder="办公室号" class="tech-input dynamic-border">
            <input type="text" id="f_level" placeholder="等级" class="tech-input dynamic-border">
            <input type="text" id="f_location" placeholder="办公地点" class="tech-input dynamic-border">
            <input type="text" id="f_worktg" placeholder="工作TG (@账号)" class="tech-input dynamic-border">
            <input type="text" id="f_privtg" placeholder="私人TG (@账号)" class="tech-input dynamic-border">
            <textarea id="f_notes" placeholder="备注" class="tech-input dynamic-border" style="grid-column:1/-1; height: 60px;"></textarea>
        </div>
        <div style="margin-top:18px; display:flex; flex-direction:column; gap:10px;">
            <button class="tech-btn dynamic-border" id="confirmWriteBtn" style="border-color:var(--success-glow); color:var(--success-glow); font-size:1.1rem; padding:12px;">💾 铭刻至量子云 (保存)</button>
            <button class="tech-btn dynamic-border" onclick="clearForm()">🧹 净化缓冲区 (清空)</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ 极其重要：在此替换为您的 Web 应用 URL ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgK-T0ae8cr9zjmhjegqLgTe4RlNy086tVd7iw_CdABYtXTJj7XvirvwpEtJ-XPL1O/exec";
    // ==========================================

    let globalEmployees = [];
    let globalSites = [];
    let globalUsers = []; // 仅admin可见
    let currentUser = null; 
    let currentFilter = { type: "all", shift: null, site: null, search: "", role: null, tenure: null };
    let currentLayout = "grid"; // grid, list, tree
    
    // 岗位归类
    const roleOrder = ["主管", "助理", "助手", "客服组长", "客服", "出款组长", "出款"];
    const roleMap = {
        "主管": "👑 主管层", "助理": "📋 助理团队", "助手": "🛠️ 助手团队",
        "客服组长": "🎧 客服组长", "客服": "💬 客服专员", "出款组长": "💰 出款组长", "出款": "💸 出款审核"
    };
    
    function getRoleGroup(role) {
        if (!role) return "其他";
        for(let r of roleOrder) { if(role.includes(r)) return r; }
        return "其他";
    }

    // 后端 POST 请求封装
    async function fetchGAS(payload) {
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch(e) {
            console.error("API请求错误:", e);
            alert("通信异常，请检查网络或部署URL");
            return {status: 'error'};
        }
    }

    /* ====== 主题控制 ====== */
    function loadUserTheme() {
        if (!currentUser) return;
        const saved = localStorage.getItem(`theme_${currentUser.email}`);
        applyCustomTheme(saved ? JSON.parse(saved) : getDefaultTheme());
    }
    
    function getDefaultTheme() {
        return {
            titleColor: "#00f0ff", primary: "#00f0ff", gradStart: "#002288", gradEnd: "#00f2ff",
            border: "rgba(0, 240, 255, 0.6)", title: "MATRIX OS · 全息指挥中枢"
        };
    }

    function applyCustomTheme(theme) {
        const root = document.documentElement;
        root.style.setProperty('--title-color', theme.titleColor || '#00f0ff');
        root.style.setProperty('--primary-glow', theme.primary || '#00f0ff');
        root.style.setProperty('--gradient-1', theme.gradStart || '#002288');
        root.style.setProperty('--gradient-2', theme.gradEnd || '#00f2ff');
        root.style.setProperty('--border-aura', theme.border || 'rgba(0, 240, 255, 0.6)');
        
        document.getElementById('mainTitle').innerText = theme.title || "MATRIX OS";
        document.title = theme.title || "MATRIX OS";
        
        document.getElementById('customTitleColor').value = theme.titleColor || "#00f0ff";
        document.getElementById('customPrimary').value = theme.primary || "#00f0ff";
        document.getElementById('customGradStart').value = theme.gradStart || "#002288";
        document.getElementById('customGradEnd').value = theme.gradEnd || "#00f2ff";
        document.getElementById('customBorder').value = theme.border || "#00f0ff";
        document.getElementById('customTitle').value = theme.title || "MATRIX OS";
    }
    
    function saveUserTheme() {
        const theme = {
            titleColor: document.getElementById('customTitleColor').value,
            primary: document.getElementById('customPrimary').value,
            gradStart: document.getElementById('customGradStart').value,
            gradEnd: document.getElementById('customGradEnd').value,
            border: document.getElementById('customBorder').value,
            title: document.getElementById('customTitle').value
        };
        localStorage.setItem(`theme_${currentUser.email}`, JSON.stringify(theme));
        applyCustomTheme(theme);
        alert("视觉协议已更新");
    }
    
    function setThemePreset(type) {
        if (type === 'light') {
            document.body.classList.add('theme-light');
            applyCustomTheme({ titleColor: "#0077ff", primary: "#0077ff", gradStart: "#82b4ff", gradEnd: "#d4f0ff", border: "#3b82f6", title: document.getElementById('customTitle').value || "MATRIX OS" });
        } else {
            document.body.classList.remove('theme-light');
            applyCustomTheme(getDefaultTheme());
        }
    }

    /* ====== 核心逻辑 ====== */
    async function verifyLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPwd').value.trim();
        if(!email || !pwd) return alert("信息残缺，拒绝接入");
        
        const btn = document.getElementById('verifyLoginBtn');
        btn.innerText = "量子信道连接中..."; btn.disabled = true;
        
        const res = await fetchGAS({action: 'login', email: email, password: pwd});
        if(res.status === 'success') {
            currentUser = res.user;
            document.getElementById('loginOverlay').style.display = 'none';
            if(currentUser.role === 'Admin') {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
            }
            document.getElementById('set_nickname').value = currentUser.nickname;
            loadUserTheme();
            await fetchInitData();
        } else {
            alert(res.msg); 
        }
        btn.innerText = "接入中枢系统"; btn.disabled = false;
    }

    function logout() {
        currentUser = null;
        document.getElementById('settingsOverlay').style.display = 'none';
        document.getElementById('loginOverlay').style.display = 'flex';
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        document.getElementById('loginPwd').value = '';
    }

    async function fetchInitData() {
        const res = await fetchGAS({action: 'getInitData', role: currentUser.role});
        if(res.status === 'success') {
            globalEmployees = res.employees || [];
            globalSites = res.sites || [];
            globalUsers = res.users || [];
            renderUI();
        }
    }

    function renderUI() {
        renderSiteList();
        renderDashboardStats();
        
        // 渲染站点下拉
        const deptSelect = document.getElementById('f_dept');
        deptSelect.innerHTML = '<option value="">选择站点</option>' + globalSites.map(s => `<option>${s}</option>`).join('');
        
        // 渲染设置面板里的列表
        if(currentUser.role === 'Admin') {
            document.getElementById('settingsSiteList').innerHTML = globalSites.map(s => 
                `<div style="display:flex; justify-content:space-between; padding:5px; background:rgba(0,0,0,0.3); border-radius:5px;">
                    <span>${s}</span>
                    <span style="color:var(--danger-neon); cursor:pointer;" onclick="deleteSite('${s}')">🗑️</span>
                </div>`
            ).join('');
            
            document.getElementById('settingsAdminList').innerHTML = globalUsers.map(u => 
                `<div style="display:flex; justify-content:space-between; padding:5px; background:rgba(0,0,0,0.3); border-radius:5px;">
                    <span>${u.email} (${u.nickname})</span>
                    ${u.email !== currentUser.email ? `<span style="color:var(--danger-neon); cursor:pointer;" onclick="deleteAdmin('${u.email}')">🗑️</span>` : '<span>自我</span>'}
                </div>`
            ).join('');
        }
    }

    function renderSiteList() {
        const container = document.getElementById('siteList');
        container.innerHTML = `
            <div class="site-menu-item">
                <button class="hud-btn dynamic-border" style="width:100%; text-align:left;" onclick="showGlobalView()">🌐 矩阵总览 ▼</button>
                <div class="site-shifts" id="shifts-global" style="margin-top:5px; padding-left:10px;">
                    <button class="shift-btn dynamic-border" onclick="filterData(null, null)">🔹 所有周期</button>
                    <button class="shift-btn dynamic-border" onclick="filterData(null, 'A班')">🔸 A班周期</button>
                    <button class="shift-btn dynamic-border" onclick="filterData(null, 'B班')">🔸 B班周期</button>
                </div>
            </div>`;
            
        globalSites.forEach((site, index) => {
            container.innerHTML += `
            <div class="site-menu-item" style="margin-top:10px;">
                <button class="hud-btn dynamic-border" style="width:100%; text-align:left;" onclick="toggleSiteShifts(${index}, '${site}')">📡 ${site} ▼</button>
                <div class="site-shifts" id="shifts-for-${index}" style="margin-top:5px; padding-left:10px;">
                    <button class="shift-btn dynamic-border" onclick="filterData('${site}', null)">🔹 全线运作</button>
                    <button class="shift-btn dynamic-border" onclick="filterData('${site}', 'A班')">🔸 Alpha 小队 (A班)</button>
                    <button class="shift-btn dynamic-border" onclick="filterData('${site}', 'B班')">🔸 Beta 小队 (B班)</button>
                </div>
            </div>`;
        });
    }

    function toggleSiteShifts(index, site) {
        document.querySelectorAll('.site-shifts').forEach(el => el.classList.remove('active'));
        document.getElementById(`shifts-for-${index}`).classList.add('active');
        filterData(site, null);
    }
    function showGlobalView() {
        document.querySelectorAll('.site-shifts').forEach(el => el.classList.remove('active'));
        document.getElementById(`shifts-global`).classList.add('active');
        filterData(null, null);
    }

    /* ====== 仪表盘统计 ====== */
    function calcTenureMonths(hireDateStr) {
        if(!hireDateStr) return -1;
        const hd = new Date(hireDateStr);
        if(isNaN(hd.getTime())) return -1;
        const now = new Date();
        return (now.getFullYear() - hd.getFullYear()) * 12 + (now.getMonth() - hd.getMonth());
    }

    function renderDashboardStats() {
        let stats = { "总人数": globalEmployees.length };
        roleOrder.forEach(r => stats[r] = 0);
        
        let tStats = { "新人(3月内)":0, "平稳期(6-12月)":0, "老兵(1年以上)":0, "核心(2年以上)":0 };

        globalEmployees.forEach(e => {
            let g = getRoleGroup(e['岗位']);
            if(stats[g] !== undefined) stats[g]++;
            
            let months = calcTenureMonths(e['入职日期']);
            if(months >= 0) {
                if(months <= 3) tStats["新人(3月内)"]++;
                else if(months >= 6 && months < 12) tStats["平稳期(6-12月)"]++;
                else if(months >= 12 && months < 24) tStats["老兵(1年以上)"]++;
                else if(months >= 24) tStats["核心(2年以上)"]++;
            }
        });

        // 渲染岗位卡片
        document.getElementById('dashboardStatsGrid').innerHTML = Object.keys(stats).map(k => 
            `<div class="stat-card dynamic-border" onclick="filterByStat('${k}', 'role')">
                <div class="stat-card-title">${k === '总人数' ? '全矩阵算力' : k}</div>
                <div class="stat-card-value">${stats[k]}</div>
            </div>`
        ).join('');
        
        // 渲染任职时间卡片
        document.getElementById('tenureStatsGrid').innerHTML = Object.keys(tStats).map(k => 
            `<div class="stat-card dynamic-border" onclick="filterByStat('${k}', 'tenure')">
                <div class="stat-card-title">${k}</div>
                <div class="stat-card-value">${tStats[k]}</div>
            </div>`
        ).join('');
    }

    function showDashboardView() {
        document.getElementById('statsDashboardArea').style.display = 'block';
        document.getElementById('staffViewArea').style.display = 'none';
        renderDashboardStats();
    }

    /* ====== 人员视图与过滤 ====== */
    function filterByStat(val, type) {
        currentFilter = { type: "all", shift: null, site: null, search: "", role: null, tenure: null };
        if(type === 'role' && val !== '总人数') currentFilter.role = val;
        if(type === 'tenure') currentFilter.tenure = val;
        
        document.getElementById('statsDashboardArea').style.display = 'none';
        document.getElementById('staffViewArea').style.display = 'block';
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = 'inline-block';
    }

    function filterData(site, shift) {
        currentFilter = { type: "all", shift: shift, site: site, search: "", role: null, tenure: null };
        document.getElementById('statsDashboardArea').style.display = 'none';
        document.getElementById('staffViewArea').style.display = 'block';
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = 'inline-block';
    }
    
    function resetToFullView() { showDashboardView(); }
    
    function handleSearch() {
        const v = document.getElementById('searchInput').value.trim();
        if(v) {
            currentFilter = { type: "all", shift: null, site: null, search: v.toLowerCase(), role: null, tenure: null };
            document.getElementById('statsDashboardArea').style.display = 'none';
            document.getElementById('staffViewArea').style.display = 'block';
            renderHierarchy();
            document.getElementById('resetFilterBtn').style.display = 'inline-block';
        } else {
            showDashboardView();
        }
    }

    function cycleLayout() {
        currentLayout = currentLayout === 'grid' ? 'list' : currentLayout === 'list' ? 'tree' : 'grid';
        if(document.getElementById('staffViewArea').style.display !== 'none') renderHierarchy();
    }

    function renderHierarchy() {
        let filtered = [...globalEmployees];
        
        if(currentFilter.site) filtered = filtered.filter(e => e['站点'] === currentFilter.site);
        if(currentFilter.shift) filtered = filtered.filter(e => e['班次'] === currentFilter.shift);
        if(currentFilter.search) {
            filtered = filtered.filter(e => 
                (e['姓名'] && e['姓名'].toLowerCase().includes(currentFilter.search)) ||
                (e['工号'] && String(e['工号']).toLowerCase().includes(currentFilter.search))
            );
        }
        if(currentFilter.role) filtered = filtered.filter(e => getRoleGroup(e['岗位']) === currentFilter.role);
        if(currentFilter.tenure) {
            filtered = filtered.filter(e => {
                let m = calcTenureMonths(e['入职日期']);
                if(currentFilter.tenure.includes("3月")) return m >= 0 && m <= 3;
                if(currentFilter.tenure.includes("6-12")) return m >= 6 && m < 12;
                if(currentFilter.tenure.includes("1年")) return m >= 12 && m < 24;
                if(currentFilter.tenure.includes("2年")) return m >= 24;
                return false;
            });
        }
        
        const groups = {主管:[],助理:[],助手:[],客服组长:[],客服:[],出款组长:[],出款:[],其他:[]};
        filtered.forEach(emp => { 
            const g = getRoleGroup(emp['岗位']); 
            if(groups[g]) groups[g].push(emp); else groups.其他.push(emp); 
        });
        
        const container = document.getElementById('hierarchyContainer');
        container.innerHTML = '';
        
        let containerClass = `staff-${currentLayout === 'list' ? 'list' : currentLayout === 'tree' ? 'tree' : 'grid'}`;

        for(let key of [...roleOrder, "其他"]) {
            if(groups[key] && groups[key].length) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'hierarchy-group';
                groupDiv.innerHTML = `<div class="group-label dynamic-border">${roleMap[key] || key} (${groups[key].length})</div><div class="${containerClass}"></div>`;
                container.appendChild(groupDiv);
                
                const gridDiv = groupDiv.querySelector(`.${containerClass}`);
                groups[key].forEach(emp => gridDiv.appendChild(createStaffCard(emp)));
            }
        }
        
        let titleText = currentFilter.site ? `📍 ${currentFilter.site}` : "🌌 矩阵全体";
        if(currentFilter.shift) titleText += ` · ${currentFilter.shift}`;
        if(currentFilter.role || currentFilter.tenure) titleText += ` (专向过滤)`;
        document.getElementById('currentViewTitle').innerHTML = titleText;
    }
    
    function createStaffCard(emp) {
        const card = document.createElement('div');
        card.className = `staff-card dynamic-border ${currentLayout}-mode`;
        card.onclick = () => showEmployeeProfile(emp);
        
        if (currentLayout === 'grid' || currentLayout === 'tree') {
            card.innerHTML = `
                <div class="card-site"><span>${emp['站点']||'未分配'}</span><span>${emp['班次']||''}</span></div>
                <div class="staff-name">${emp['姓名']||'?'}<small style="color:var(--text-dim);font-size:0.8rem;">#${emp['工号']||''}</small></div>
                <div class="staff-role">${emp['岗位']||'员工'}</div>
                <div class="staff-meta"><span>📅 ${emp['入职日期']||'未知'}</span><span style="color:var(--success-glow);">${emp['工作TG']||''}</span></div>
            `;
        } else {
            card.innerHTML = `
                <div style="display:flex; gap:15px; align-items:center;">
                    <strong style="width:100px; color:var(--text-bright);">${emp['姓名']}</strong>
                    <span style="width:80px; color:var(--text-dim);">#${emp['工号']}</span>
                    <span class="staff-role">${emp['岗位']}</span>
                </div>
                <div style="display:flex; gap:15px; align-items:center;">
                    <span style="color:var(--primary-glow); font-size:0.8rem;">${emp['站点']||'-'} / ${emp['班次']||'-'}</span>
                    <span style="color:var(--success-glow); font-size:0.8rem; width:120px; text-align:right;">${emp['工作TG']||'-'}</span>
                </div>
            `;
        }
        return card;
    }

    /* ====== 弹窗档案展示 ====== */
    function showEmployeeProfile(emp) {
        const modal = document.getElementById('holoModal');
        const content = document.getElementById('modalContent');
        
        content.innerHTML = `
            <h3 style="color:var(--primary-glow); margin-bottom:15px; border-bottom: 1px dashed var(--border-aura); padding-bottom:10px;">
                🧬 实体解析: ${emp['姓名']}
            </h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom: 25px;">
                <div><div class="stat-label">工号</div><div class="stat-value-text">${emp['工号']||'-'}</div></div>
                <div><div class="stat-label">岗位 / 等级</div><div class="stat-value-text">${emp['岗位']||'-'} / ${emp['等级']||'-'}</div></div>
                <div><div class="stat-label">站点 / 班次</div><div class="stat-value-text">${emp['站点']||'-'} / ${emp['班次']||'-'}</div></div>
                <div><div class="stat-label">直属上司</div><div class="stat-value-text">${emp['上司工号']||'-'}</div></div>
                <div><div class="stat-label">入职日期</div><div class="stat-value-text">${emp['入职日期']||'-'}</div></div>
                <div><div class="stat-label">出生日期</div><div class="stat-value-text">${emp['出生日期']||'-'}</div></div>
                <div><div class="stat-label">国籍 / 办公室</div><div class="stat-value-text">${emp['国籍']||'-'} / ${emp['办公室号']||'-'}</div></div>
                <div><div class="stat-label">办公坐标</div><div class="stat-value-text">${emp['办公地点']||'-'}</div></div>
                <div><div class="stat-label">工作节点 (TG)</div><div class="stat-value-text" style="color:var(--success-glow);">${emp['工作TG']||'-'}</div></div>
                <div><div class="stat-label">私人频段 (TG)</div><div class="stat-value-text">${emp['私人TG']||'-'}</div></div>
                <div style="grid-column:1/-1;"><div class="stat-label">特殊备注</div><div class="stat-value-text">${emp['备注']||'无记录'}</div></div>
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                ${currentUser.role === 'Admin' ? `<button class="tech-btn dynamic-border" style="border-color:var(--danger-neon); color:var(--danger-neon);" onclick="execDeleteEmployee('${emp['工号']}')">🗑️ 抹除实体</button>` : ''}
                ${currentUser.role === 'Admin' ? `<button class="tech-btn dynamic-border" onclick="fillFormForEdit('${emp['工号']}')">✏️ 提取终端编辑</button>` : ''}
                <button class="tech-btn dynamic-border" onclick="closeModal()">✖ 中断连接 (关闭)</button>
            </div>
        `;
        modal.style.display = 'flex';
    }
    
    function fillFormForEdit(id) {
        closeModal();
        const emp = globalEmployees.find(e => String(e['工号']) === String(id));
        if(!emp) return;
        document.getElementById('rightPanel').classList.remove('hidden-right');
        
        const fields = ["工号", "姓名", "性别", "岗位", "站点", "班次", "上司工号", "邮箱", "入职日期", "出生日期", "国籍", "办公室号", "等级", "办公地点", "工作TG", "私人TG", "备注"];
        const ids = ["f_id", "f_name", "f_gender", "f_pos", "f_dept", "f_shift", "f_manager", "f_email", "f_hire", "f_dob", "f_nation", "f_office", "f_level", "f_location", "f_worktg", "f_privtg", "f_notes"];
        
        fields.forEach((f, i) => { const el = document.getElementById(ids[i]); if (el) el.value = emp[f] || ''; });
    }

    /* ====== 核心写入/删除 ====== */
    document.getElementById('confirmWriteBtn').onclick = async () => {
        if(currentUser.role !== 'Admin') return alert("权限不足");
        const f_id = document.getElementById('f_id').value.trim();
        const f_name = document.getElementById('f_name').value.trim();
        if(!f_id || !f_name) return alert("⚠️ [工号] 和 [姓名] 必须存在");
        
        if(!confirm(`确认将实体 [${f_name}] 烙印至量子云端吗？`)) return;

        const btn = document.getElementById('confirmWriteBtn');
        btn.innerText = "数据同步中..."; btn.disabled = true;

        const empData = {
            "工号": f_id, "姓名": f_name, "性别": document.getElementById('f_gender').value,
            "岗位": document.getElementById('f_pos').value, "站点": document.getElementById('f_dept').value,
            "班次": document.getElementById('f_shift').value, "上司工号": document.getElementById('f_manager').value,
            "邮箱": document.getElementById('f_email').value, "入职日期": document.getElementById('f_hire').value,
            "出生日期": document.getElementById('f_dob').value, "国籍": document.getElementById('f_nation').value,
            "办公室号": document.getElementById('f_office').value, "等级": document.getElementById('f_level').value,
            "办公地点": document.getElementById('f_location').value, "工作TG": document.getElementById('f_worktg').value,
            "私人TG": document.getElementById('f_privtg').value, "备注": document.getElementById('f_notes').value
        };

        const res = await fetchGAS({ action: 'saveEmployee', data: empData });
        if(res.status === 'success') { alert("✅ 写入成功"); clearForm(); await fetchInitData(); } 
        else { alert("❌ 失败: " + res.msg); }
        
        btn.innerText = "💾 铭刻至量子云 (保存)"; btn.disabled = false;
    };

    async function execDeleteEmployee(id) {
        if(!confirm(`⚠️ 极度危险：您正在永久抹除工号 [${id}] 的存在，不可逆转。确认执行？`)) return;
        const res = await fetchGAS({ action: 'deleteEmployee', id: id });
        if(res.status === 'success') { alert("✅ 实体已抹除"); closeModal(); await fetchInitData(); }
        else { alert("❌ 操作异常: " + res.msg); }
    }

    /* ====== 设置面板交互 ====== */
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    async function updateProfile() {
        const nn = document.getElementById('set_nickname').value;
        const pwd = document.getElementById('set_pwd').value;
        if(pwd && !confirm("确认更改访问密匙？")) return;
        
        const res = await fetchGAS({ action: 'updateProfile', email: currentUser.email, nickname: nn, newPassword: pwd });
        if(res.status === 'success') { alert("✅ 个人协议更新成功"); currentUser.nickname = nn; }
        else alert("❌ 更新失败");
    }

    async function addSite() {
        const v = document.getElementById('newSiteInput').value.trim();
        if(!v) return;
        if(!confirm(`确认构建新站点 [${v}]？`)) return;
        const res = await fetchGAS({ action: 'manageSite', type: 'add', siteName: v });
        if(res.status === 'success') { document.getElementById('newSiteInput').value=''; await fetchInitData(); alert('已构建'); }
    }
    
    async function deleteSite(v) {
        if(!confirm(`确认坍缩站点 [${v}]？`)) return;
        const res = await fetchGAS({ action: 'manageSite', type: 'delete', siteName: v });
        if(res.status === 'success') { await fetchInitData(); alert('已坍缩'); }
    }

    async function addAdmin() {
        const em = document.getElementById('newAdminEmail').value.trim();
        const pw = document.getElementById('newAdminPwd').value.trim();
        if(!em || !pw) return alert("参数残缺");
        if(!confirm(`授予 [${em}] 最高控制权？`)) return;
        const res = await fetchGAS({ action: 'manageUser', type: 'add', newUserEmail: em, newUserPwd: pw });
        if(res.status === 'success') { document.getElementById('newAdminEmail').value=''; document.getElementById('newAdminPwd').value=''; await fetchInitData(); alert('授权成功'); }
    }

    async function deleteAdmin(em) {
        if(!confirm(`剥夺 [${em}] 的控制权？`)) return;
        const res = await fetchGAS({ action: 'manageUser', type: 'delete', delEmail: em });
        if(res.status === 'success') { await fetchInitData(); alert('已剥夺'); }
    }

    /* ====== 辅助工具 ====== */
    function clearForm() { 
        document.querySelectorAll('#editorForm input, #editorForm textarea').forEach(i=>i.value=''); 
        document.getElementById('f_gender').value = '男'; document.getElementById('f_shift').value = 'A班'; document.getElementById('f_dept').value = '';
    }
    function togglePanel(id) { document.getElementById(id).classList.toggle(id==='leftPanel'?'hidden-left':'hidden-right'); }
    function closeModal() { document.getElementById('holoModal').style.display = 'none'; }
    function closeSettings() { document.getElementById('settingsOverlay').style.display = 'none'; }
    function openSettings() { if(currentUser) document.getElementById('settingsOverlay').style.display = 'flex'; }
    
    // 初始化弹窗 DOM
    const modalDiv = document.createElement('div');
    modalDiv.id = 'holoModal';
    modalDiv.className = 'holo-overlay';
    modalDiv.onclick = (e) => { if(e.target === modalDiv) closeModal(); };
    modalDiv.innerHTML = '<div class="holo-dialog dynamic-border" id="modalContent"></div>';
    document.body.appendChild(modalDiv);
</script>
</body>
