<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MATRIX OS - 全息指挥中枢</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Orbitron', 'Share Tech Mono', system-ui; }
        :root {
            --bg-deep: #010514;
            --bg-surface: rgba(6, 16, 32, 0.75);
            --primary-glow: #00f0ff;
            --border-aura: rgba(0, 240, 255, 0.6);
            --text-bright: #eef5ff;
            --text-dim: #8db3e0;
            --card-bg: rgba(4, 12, 24, 0.7);
            --danger-neon: #ff2a6d;
            --success-glow: #39ff14;
            --gradient-1: #002288;
            --gradient-2: #00f2ff;
            --glass-blur: 12px;
            --modal-bg: rgba(2, 10, 22, 0.96);
            --title-color: #00f0ff;
        }
        body.theme-light {
            --bg-deep: #eef2ff;
            --bg-surface: rgba(255, 255, 255, 0.75);
            --primary-glow: #0077ff;
            --border-aura: #3b82f6;
            --text-bright: #0a0a2a;
            --text-dim: #2c3e66;
            --card-bg: rgba(255, 255, 255, 0.85);
            --modal-bg: rgba(240, 245, 255, 0.96);
            --gradient-1: #82b4ff;
            --gradient-2: #d4f0ff;
            --title-color: #0077ff;
        }
        body { background-color: var(--bg-deep); color: var(--text-bright); font-size: 14px; height: 100vh; overflow: hidden; transition: background 0.4s, color 0.4s; }
        
        /* 动态极光渐变背景 */
        .aurora-field { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: linear-gradient(45deg, var(--bg-deep), var(--gradient-1), var(--gradient-2), var(--bg-deep)); 
            background-size: 400% 400%;
            animation: aurora-flow 15s ease infinite;
            opacity: 0.8; filter: blur(40px); transition: background 0.4s; 
        }
        @keyframes aurora-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 高级极光动态边框 */
        .dynamic-border {
            border: 1px solid var(--border-aura);
            animation: borderPulse 3s infinite alternate;
        }
        @keyframes borderPulse {
            0% { border-color: var(--border-aura); box-shadow: 0 0 5px rgba(0, 240, 255, 0.1); }
            100% { border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        }

        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--primary-glow); border-radius: 10px; }
        .glass-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; backdrop-filter: blur(var(--glass-blur)); background: var(--bg-surface); z-index: 100; border-bottom: 1px solid var(--primary-glow);}
        .logo-area { display: flex; gap: 20px; align-items: center; }
        .neon-text { font-size: 1.4rem; font-weight: 800; letter-spacing: 3px; color: var(--title-color); text-shadow: 0 0 10px var(--title-color); transition: color 0.3s; }
        
        .hud-btn { background: var(--bg-surface); border: 1px solid var(--border-aura); color: var(--primary-glow); padding: 6px 16px; cursor: pointer; border-radius: 20px; transition: 0.3s; font-weight: bold; backdrop-filter: blur(4px); }
        .hud-btn:hover, .hud-btn.active { background: var(--primary-glow); color: #fff; box-shadow: 0 0 15px var(--primary-glow); border-color: transparent;}
        
        .theme-picker { display: flex; gap: 8px; margin-left: 15px; }
        .theme-icon { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border-aura); transition: 0.2s; }
        .theme-icon.dark { background: #010514; box-shadow: 0 0 6px #00f0ff; }
        .theme-icon.light { background: #eef2ff; box-shadow: 0 0 6px #3b82f6; }
        
        .search-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border-aura); color: var(--text-bright); padding: 6px 12px; border-radius: 20px; outline: none; width: 200px; transition: 0.3s; }
        .search-box:focus { border-color: var(--primary-glow); box-shadow: 0 0 10px var(--primary-glow); }

        .dashboard { display: flex; height: calc(100vh - 68px); overflow: hidden; }
        .side-panel { width: 260px; backdrop-filter: blur(10px); background: var(--bg-surface); padding: 20px 12px; overflow-y: auto; transition: transform 0.3s, margin 0.3s; }
        .right-panel { width: 380px; }
        .hidden-left { transform: translateX(-100%); margin-left: -260px; }
        .hidden-right { transform: translateX(100%); margin-right: -380px; }
        .main-stage { flex: 1; padding: 20px; overflow-y: auto; position: relative;}
        
        .section-title { font-size: 1.1rem; border-left: 4px solid var(--primary-glow); padding-left: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; color: var(--text-bright); }
        .hierarchy-group { margin-bottom: 28px; }
        .group-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; background: rgba(0,240,255,0.15); display: inline-block; padding: 4px 14px; border-radius: 20px; margin-bottom: 12px; backdrop-filter: blur(4px); border-left: 2px solid var(--primary-glow); color: var(--text-bright);}
        
        /* 视图容器 */
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
        .staff-list { display: flex; flex-direction: column; gap: 10px; }
        .staff-tree { padding-left: 20px; border-left: 1px dashed var(--border-aura); display: flex; flex-direction: column; gap: 8px;}
        
        .staff-card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 16px; padding: 16px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;}
        .staff-card:hover { transform: translateY(-5px); }
        
        /* 列表视图样式 */
        .staff-card.list-mode { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-radius: 8px; }
        .staff-card.list-mode .card-site, .staff-card.list-mode .staff-meta { margin: 0; }
        
        /* 树状图样式 */
        .staff-card.tree-mode { display: inline-block; width: fit-content; padding: 6px 12px; border-radius: 6px; }

        .card-site { font-size: 0.65rem; color: var(--primary-glow); margin-bottom: 8px; display: flex; justify-content: space-between; }
        .staff-name { font-size: 1.2rem; font-weight: bold; display: flex; align-items: baseline; gap: 8px; margin: 8px 0; color: var(--text-bright); }
        .staff-role { font-size: 0.7rem; background: rgba(0,240,255,0.2); display: inline-block; padding: 2px 10px; border-radius: 14px; color: var(--text-bright); }
        .staff-meta { margin-top: 12px; font-size: 0.75rem; display: flex; justify-content: space-between; color: var(--text-dim); }
        
        .site-menu-item { display: flex; flex-direction: column; margin-bottom: 8px; }
        .site-shifts { display: none; padding-left: 20px; margin-top: 8px; gap: 6px; flex-direction: column; }
        .site-shifts.active { display: flex; }
        .shift-btn { font-size: 0.8rem; background: transparent; border: 1px dashed var(--border-aura); color: var(--text-bright); padding: 4px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: left;}
        .shift-btn:hover { background: var(--primary-glow); color: #fff; }

        .holo-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .holo-dialog { width: 600px; max-width: 95%; background: var(--modal-bg); border-radius: 20px; padding: 28px; box-shadow: 0 0 40px rgba(0,240,255,0.2); animation: floatIn 0.3s ease; position: relative; color: var(--text-bright);}
        @keyframes floatIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
        .stat-value-text { font-size: 0.95rem; font-weight: 500; }
        
        .tech-input, select { background: rgba(0,0,0,0.3); border: 1px solid var(--border-aura); color: var(--text-bright); padding: 10px; border-radius: 8px; width: 100%; outline: none; transition: 0.3s; }
        .tech-input:focus, select:focus { border-color: var(--primary-glow); box-shadow: 0 0 8px rgba(0,240,255,0.4); }
        .tech-btn { background: transparent; border: 1px solid var(--primary-glow); color: var(--primary-glow); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
        .tech-btn:hover { background: var(--primary-glow); color: #fff; box-shadow: 0 0 10px var(--primary-glow); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .setting-group { margin-bottom: 20px; border-bottom: 1px dashed var(--border-aura); padding-bottom: 16px; }
        .color-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; color: var(--text-bright); }
    </style>
</head>
<body>
<div class="aurora-field" id="auroraBg"></div>

<div id="loginOverlay" class="holo-overlay" style="display: flex; z-index: 3000;">
    <div class="holo-dialog dynamic-border" style="text-align:center; width: 400px;">
        <h3 style="color:var(--primary-glow);">🌀 量子身份验证</h3>
        <input type="email" id="loginEmail" class="tech-input" style="margin:20px 0;" placeholder="输入白名单邮箱进行验证">
        <button class="tech-btn" id="verifyLoginBtn" style="width: 100%;">接入中枢</button>
    </div>
</div>

<div id="settingsOverlay" class="holo-overlay" style="z-index: 2500;">
    <div class="holo-dialog dynamic-border" style="width: 700px; max-width: 90%;">
        <h3 style="color:var(--primary-glow); margin-bottom: 20px;">⚙️ 全息中枢高级配置</h3>
        <div style="max-height: 60vh; overflow-y: auto; padding-right: 10px;">
            <div class="setting-group">
                <div class="section-title" style="margin-bottom: 12px;">🎨 视觉主题 (仅自己可见)</div>
                <div class="color-row"><span>系统标题颜色</span><input type="color" id="customTitleColor" class="tech-input" style="width: 100px;"></div>
                <div class="color-row"><span>主发光色 (Primary)</span><input type="color" id="customPrimary" class="tech-input" style="width: 100px;"></div>
                <div class="color-row"><span>极光渐变色1</span><input type="color" id="customGradStart" style="width: 100px;"></div>
                <div class="color-row"><span>极光渐变色2</span><input type="color" id="customGradEnd" style="width: 100px;"></div>
                <div class="color-row"><span>动态边框基础色</span><input type="color" id="customBorder" style="width: 100px;"></div>
                <div class="color-row"><span>系统标题文本</span><input type="text" id="customTitle" class="tech-input" style="width: 200px;"></div>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 20px;">
            <button class="tech-btn" id="saveSettingsBtn">💾 保存配置</button>
            <button class="tech-btn" onclick="closeSettings()">取消</button>
        </div>
    </div>
</div>

<header class="glass-header dynamic-border">
    <div class="logo-area">
        <button class="hud-btn" onclick="togglePanel('leftPanel')">◧ 站点矩阵</button>
        <span class="neon-text" id="mainTitle">MATRIX OS · 全息指挥中枢</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索工号/姓名..." onkeyup="handleSearch()">
        <button class="hud-btn" onclick="cycleLayout()">👁️ 切换视图</button>
        <div class="theme-picker">
            <div class="theme-icon dark" onclick="setThemePreset('dark')"></div>
            <div class="theme-icon light" onclick="setThemePreset('light')"></div>
        </div>
        <button class="hud-btn" id="navStaffBtn">🌌 全站</button>
        <button class="hud-btn" onclick="togglePanel('rightPanel')">终端录入 ◨</button>
        <span class="hud-btn" onclick="openSettings()">⚙️</span>
    </div>
</header>

<div class="dashboard">
    <div class="side-panel dynamic-border" id="leftPanel">
        <div class="section-title">🚀 动态站点</div>
        <div id="siteList" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>
    <div class="main-stage" id="mainStage">
        <div id="staffViewArea">
            <div class="section-title">
                <span id="currentViewTitle">👥 全息员工档案</span>
                <span id="resetFilterBtn" style="cursor:pointer; font-size:12px; display:none;" onclick="resetToFullView()">↺ 重置过滤</span>
            </div>
            <div id="hierarchyContainer"></div>
        </div>
    </div>
    <div class="side-panel right-panel hidden-right dynamic-border" id="rightPanel">
        <div class="section-title" style="color:var(--primary-glow);">⚡ 终端录入/编辑</div>
        <div class="form-grid" id="editorForm">
            <input type="text" id="f_id" placeholder="工号*" class="tech-input">
            <input type="text" id="f_name" placeholder="姓名*" class="tech-input">
            <select id="f_gender" class="tech-input"><option>男</option><option>女</option></select>
            <input type="text" id="f_pos" placeholder="岗位" class="tech-input">
            <input type="text" id="f_dept" placeholder="站点" class="tech-input">
            <select id="f_shift" class="tech-input"><option>A班</option><option>B班</option><option>全班</option></select>
            <input type="text" id="f_manager" placeholder="上司工号" class="tech-input">
            <input type="text" id="f_email" placeholder="邮箱" class="tech-input">
            <div style="grid-column:1; display:flex; flex-direction:column;"><label style="font-size:10px;color:var(--text-dim);">入职日期</label><input type="date" id="f_hire" class="tech-input"></div>
            <div style="grid-column:2; display:flex; flex-direction:column;"><label style="font-size:10px;color:var(--text-dim);">出生日期</label><input type="date" id="f_dob" class="tech-input"></div>
            <input type="text" id="f_nation" placeholder="国籍" class="tech-input">
            <input type="text" id="f_office" placeholder="办公室号" class="tech-input">
            <input type="text" id="f_level" placeholder="等级" class="tech-input">
            <input type="text" id="f_location" placeholder="办公地点" class="tech-input">
            <input type="text" id="f_worktg" placeholder="工作TG (@账号)" class="tech-input">
            <input type="text" id="f_privtg" placeholder="私人TG (@账号)" class="tech-input">
            <textarea id="f_notes" placeholder="备注" class="tech-input" style="grid-column:1/-1; height: 60px;"></textarea>
        </div>
        <div id="adminWriteZone" style="display:none; margin-top:18px; display:flex; flex-direction:column; gap:10px;">
            <button class="tech-btn" id="confirmWriteBtn" style="border-color:var(--success-glow); color:var(--success-glow);">💾 云端保存 (新增/修改)</button>
            <button class="tech-btn" onclick="clearForm()">🧹 清空表单</button>
        </div>
        <div id="readonlyMsg" style="display:none; text-align:center; margin-top:20px; color:var(--danger-neon);">🔒 您的权限为只读</div>
    </div>
</div>

<script>
    // ⚠️ 替换为你的最新 Apps Script 部署 URL ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgK-T0ae8cr9zjmhjegqLgTe4RlNy086tVd7iw_CdABYtXTJj7XvirvwpEtJ-XPL1O/exec";

    let globalEmployees = [];
    let currentRole = "Viewer";
    let currentUserEmail = "";
    let currentFilter = { type: "all", shift: null, site: null, search: "" };
    let currentLayout = "grid"; // grid, list, tree
    
    // 角色归类字典（保证层级清晰）
    const roleOrder = ["主管", "助理", "助手", "客服组长", "客服", "出款组长", "出款"];
    const roleMap = {
        "主管": "👑 主管层", "助理": "📋 助理团队", "助手": "🛠️ 助手团队",
        "客服组长": "🎧 客服组长", "客服": "💬 客服专员", "出款组长": "💰 出款组长", "出款": "💸 出款审核"
    };
    
    function getRoleGroup(role) {
        if (!role) return "其他";
        if (role.includes("主管")) return "主管";
        if (role.includes("助理")) return "助理";
        if (role.includes("助手")) return "助手";
        if (role.includes("客服组长")) return "客服组长";
        if (role.includes("客服")) return "客服";
        if (role.includes("出款组长")) return "出款组长";
        if (role.includes("出款")) return "出款";
        return "其他";
    }

    /* ====== 主题管理 (含标题颜色自定义) ====== */
    function loadUserTheme() {
        if (!currentUserEmail) return;
        const saved = localStorage.getItem(`theme_${currentUserEmail}`);
        if (saved) applyCustomTheme(JSON.parse(saved));
        else applyCustomTheme(getDefaultTheme());
    }
    
    function getDefaultTheme() {
        return {
            titleColor: "#00f0ff", primary: "#00f0ff", gradStart: "#002288", gradEnd: "#00f2ff",
            border: "rgba(0, 240, 255, 0.6)", title: "MATRIX OS · 全息指挥中枢"
        };
    }

    function applyCustomTheme(theme) {
        const root = document.documentElement;
        root.style.setProperty('--title-color', theme.titleColor || '#00f0ff');
        root.style.setProperty('--primary-glow', theme.primary || '#00f0ff');
        root.style.setProperty('--gradient-1', theme.gradStart || '#002288');
        root.style.setProperty('--gradient-2', theme.gradEnd || '#00f2ff');
        root.style.setProperty('--border-aura', theme.border || 'rgba(0, 240, 255, 0.6)');
        
        document.getElementById('mainTitle').innerText = theme.title || "MATRIX OS";
        document.title = theme.title || "MATRIX OS";
        
        // 绑定到表单
        document.getElementById('customTitleColor').value = theme.titleColor || "#00f0ff";
        document.getElementById('customPrimary').value = theme.primary || "#00f0ff";
        document.getElementById('customGradStart').value = theme.gradStart || "#002288";
        document.getElementById('customGradEnd').value = theme.gradEnd || "#00f2ff";
        document.getElementById('customBorder').value = theme.border || "#00f0ff";
        document.getElementById('customTitle').value = theme.title || "MATRIX OS";
    }
    
    function saveUserTheme() {
        const theme = {
            titleColor: document.getElementById('customTitleColor').value,
            primary: document.getElementById('customPrimary').value,
            gradStart: document.getElementById('customGradStart').value,
            gradEnd: document.getElementById('customGradEnd').value,
            border: document.getElementById('customBorder').value,
            title: document.getElementById('customTitle').value
        };
        localStorage.setItem(`theme_${currentUserEmail}`, JSON.stringify(theme));
        applyCustomTheme(theme);
        closeSettings();
    }
    
    function setThemePreset(type) {
        if (type === 'light') {
            document.body.classList.add('theme-light');
            applyCustomTheme({ titleColor: "#0077ff", primary: "#0077ff", gradStart: "#82b4ff", gradEnd: "#d4f0ff", border: "#3b82f6", title: document.getElementById('customTitle').value || "MATRIX OS" });
        } else {
            document.body.classList.remove('theme-light');
            applyCustomTheme(getDefaultTheme());
        }
    }

    /* ====== 数据加载与页面交互 ====== */
    async function verifyLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        if(!email) return alert("请输入邮箱");
        const btn = document.getElementById('verifyLoginBtn');
        btn.innerText = "量子接入中..."; btn.disabled = true;
        
        try {
            const res = await fetch(`${SCRIPT_URL}?action=verifyEmail&email=${encodeURIComponent(email)}`);
            const data = await res.json();
            if(data.allowed) {
                currentUserEmail = email;
                currentRole = data.role || "Viewer";
                document.getElementById('loginOverlay').style.display = 'none';
                
                if(currentRole === 'Admin') document.getElementById('adminWriteZone').style.display = 'flex';
                else document.getElementById('readonlyMsg').style.display = 'block';
                
                loadUserTheme();
                await loadEmployees();
            } else { 
                alert("未授权: 不在白名单"); btn.innerText = "接入中枢"; btn.disabled = false; 
            }
        } catch(e) { alert("网络异常"); btn.innerText = "接入中枢"; btn.disabled = false; }
    }
    
    async function loadEmployees() {
        try {
            const resp = await fetch(`${SCRIPT_URL}?action=getEmployees`);
            const data = await resp.json();
            globalEmployees = Array.isArray(data) ? data : [];
            renderSiteList();
            renderHierarchy();
        } catch (error) {
            console.error(error);
        }
    }

    /* ====== 站点左侧导航 (支持子菜单下拉班次) ====== */
    function renderSiteList() {
        const sites = [...new Set(globalEmployees.map(e=>e['站点']).filter(Boolean))];
        const container = document.getElementById('siteList');
        container.innerHTML = `
            <div class="site-menu-item">
                <button class="hud-btn" onclick="filterBySite(null)">🌐 全站总览</button>
            </div>`;
            
        sites.forEach((site, index) => {
            const safeSite = site.replace(/'/g, "\\'");
            container.innerHTML += `
            <div class="site-menu-item">
                <button class="hud-btn" onclick="toggleSiteShifts(${index}, '${safeSite}')">📡 ${site} ▼</button>
                <div class="site-shifts" id="shifts-for-${index}">
                    <button class="shift-btn" onclick="filterBySite('${safeSite}', null)">🔹 全班</button>
                    <button class="shift-btn" onclick="filterBySite('${safeSite}', 'A班')">🔸 A班</button>
                    <button class="shift-btn" onclick="filterBySite('${safeSite}', 'B班')">🔸 B班</button>
                </div>
            </div>`;
        });
    }

    function toggleSiteShifts(index, site) {
        document.querySelectorAll('.site-shifts').forEach(el => el.classList.remove('active'));
        document.getElementById(`shifts-for-${index}`).classList.toggle('active');
        filterBySite(site, null);
    }
    
    function filterBySite(site, shift = null) {
        currentFilter.site = site;
        currentFilter.shift = shift;
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = 'inline-block';
    }
    
    function resetToFullView() {
        currentFilter = { type: "all", site: null, shift: null, search: "" };
        document.getElementById('searchInput').value = "";
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = 'none';
        document.querySelectorAll('.site-shifts').forEach(el => el.classList.remove('active'));
    }

    function handleSearch() {
        currentFilter.search = document.getElementById('searchInput').value.trim().toLowerCase();
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = currentFilter.search ? 'inline-block' : 'none';
    }

    function cycleLayout() {
        if(currentLayout === 'grid') currentLayout = 'list';
        else if(currentLayout === 'list') currentLayout = 'tree';
        else currentLayout = 'grid';
        renderHierarchy();
    }

    /* ====== 渲染主体内容 ====== */
    function renderHierarchy() {
        let filtered = [...globalEmployees];
        
        // 应用筛选
        if(currentFilter.site) filtered = filtered.filter(e => e['站点'] === currentFilter.site);
        if(currentFilter.shift) filtered = filtered.filter(e => e['班次'] === currentFilter.shift);
        if(currentFilter.search) {
            filtered = filtered.filter(e => 
                (e['姓名'] && e['姓名'].toLowerCase().includes(currentFilter.search)) ||
                (e['工号'] && String(e['工号']).toLowerCase().includes(currentFilter.search))
            );
        }
        
        const groups = {主管:[],助理:[],助手:[],客服组长:[],客服:[],出款组长:[],出款:[],其他:[]};
        filtered.forEach(emp => { 
            const g = getRoleGroup(emp['岗位']); 
            if(groups[g]) groups[g].push(emp); else groups.其他.push(emp); 
        });
        
        const container = document.getElementById('hierarchyContainer');
        container.innerHTML = '';
        
        let containerClass = "staff-grid";
        if(currentLayout === 'list') containerClass = "staff-list";
        if(currentLayout === 'tree') containerClass = "staff-tree";

        for(let key of roleOrder) {
            if(groups[key] && groups[key].length) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'hierarchy-group';
                groupDiv.innerHTML = `<div class="group-label">${roleMap[key] || key} (${groups[key].length})</div><div class="${containerClass}" id="grid-${key}"></div>`;
                container.appendChild(groupDiv);
                
                const gridDiv = groupDiv.querySelector(`.${containerClass}`);
                groups[key].forEach(emp => gridDiv.appendChild(createStaffCard(emp)));
            }
        }
        
        // 标题动态修改
        let titleText = currentFilter.site ? `📍 ${currentFilter.site}` : "🌌 全站";
        if(currentFilter.shift) titleText += ` · ${currentFilter.shift}`;
        if(currentFilter.search) titleText += ` (搜索结果)`;
        document.getElementById('currentViewTitle').innerHTML = titleText;
    }
    
    function createStaffCard(emp) {
        const card = document.createElement('div');
        card.className = `staff-card dynamic-border ${currentLayout}-mode`;
        card.onclick = () => showEmployeeProfile(emp);
        
        if (currentLayout === 'grid' || currentLayout === 'tree') {
            card.innerHTML = `
                <div class="card-site"><span>${emp['站点']||'未分配'}</span><span>${emp['班次']||''}</span></div>
                <div class="staff-name">${emp['姓名']||'?'}<small style="color:var(--text-dim);font-size:0.8rem;">#${emp['工号']||''}</small></div>
                <div class="staff-role">${emp['岗位']||'员工'}</div>
                <div class="staff-meta"><span>📅 ${emp['入职日期']||'未知'}</span><span style="color:var(--success-glow);">${emp['工作TG']||''}</span></div>
            `;
        } else if (currentLayout === 'list') {
            card.innerHTML = `
                <div style="display:flex; gap:15px; align-items:center;">
                    <strong style="width:100px; color:var(--text-bright);">${emp['姓名']}</strong>
                    <span style="width:80px; color:var(--text-dim);">#${emp['工号']}</span>
                    <span class="staff-role">${emp['岗位']}</span>
                </div>
                <div style="display:flex; gap:15px; align-items:center;">
                    <span style="color:var(--primary-glow); font-size:0.8rem;">${emp['站点']||'-'} / ${emp['班次']||'-'}</span>
                    <span style="color:var(--success-glow); font-size:0.8rem; width:120px; text-align:right;">${emp['工作TG']||'-'}</span>
                </div>
            `;
        }
        return card;
    }

    /* ====== 弹窗展示与交互 ====== */
    function showEmployeeProfile(emp) {
        const modal = document.getElementById('holoModal');
        const content = document.getElementById('modalContent');
        
        content.innerHTML = `
            <h3 style="color:var(--primary-glow); margin-bottom:15px; border-bottom: 1px dashed var(--border-aura); padding-bottom:10px;">
                🧬 ${emp['姓名']} · 全息档案
            </h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom: 20px;">
                <div><div class="stat-label">工号</div><div class="stat-value-text">${emp['工号']||'-'}</div></div>
                <div><div class="stat-label">岗位 / 等级</div><div class="stat-value-text">${emp['岗位']||'-'} / ${emp['等级']||'-'}</div></div>
                <div><div class="stat-label">站点 / 班次</div><div class="stat-value-text">${emp['站点']||'-'} / ${emp['班次']||'-'}</div></div>
                <div><div class="stat-label">上司工号</div><div class="stat-value-text">${emp['上司工号']||'-'}</div></div>
                <div><div class="stat-label">入职日期</div><div class="stat-value-text">${emp['入职日期']||'-'}</div></div>
                <div><div class="stat-label">出生日期</div><div class="stat-value-text">${emp['出生日期']||'-'}</div></div>
                <div><div class="stat-label">国籍</div><div class="stat-value-text">${emp['国籍']||'-'}</div></div>
                <div><div class="stat-label">办公室号 / 办公地点</div><div class="stat-value-text">${emp['办公室号']||'-'} / ${emp['办公地点']||'-'}</div></div>
                <div><div class="stat-label">工作TG (仅展示)</div><div class="stat-value-text" style="color:var(--success-glow);">${emp['工作TG']||'-'}</div></div>
                <div><div class="stat-label">私人TG (仅展示)</div><div class="stat-value-text">${emp['私人TG']||'-'}</div></div>
                <div style="grid-column:1/-1;"><div class="stat-label">备注</div><div class="stat-value-text">${emp['备注']||'无'}</div></div>
            </div>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                ${currentRole === 'Admin' ? `<button class="tech-btn" style="border-color:var(--danger-neon); color:var(--danger-neon);" onclick="deleteEmployee('${emp['工号']}')">🗑️ 删除员工</button>` : ''}
                ${currentRole === 'Admin' ? `<button class="tech-btn" onclick="fillFormForEdit('${emp['工号']}')">✏️ 提取编辑</button>` : ''}
                <button class="tech-btn" onclick="closeModal()">✖ 关闭</button>
            </div>
        `;
        modal.style.display = 'flex';
    }
    
    function fillFormForEdit(id) {
        closeModal();
        const emp = globalEmployees.find(e => String(e['工号']) === String(id));
        if(!emp) return;
        document.getElementById('rightPanel').classList.remove('hidden-right');
        
        const fields = ["工号", "姓名", "性别", "岗位", "站点", "班次", "上司工号", "邮箱", "入职日期", "出生日期", "国籍", "办公室号", "等级", "办公地点", "工作TG", "私人TG", "备注"];
        const ids = ["f_id", "f_name", "f_gender", "f_pos", "f_dept", "f_shift", "f_manager", "f_email", "f_hire", "f_dob", "f_nation", "f_office", "f_level", "f_location", "f_worktg", "f_privtg", "f_notes"];
        
        fields.forEach((f, i) => {
            const el = document.getElementById(ids[i]);
            if (el) el.value = emp[f] || '';
        });
    }

    /* ====== 核心数据写入/删除交互 ====== */
    async function confirmWrite() {
        if(currentRole !== 'Admin') return alert("无权限");
        const f_id = document.getElementById('f_id').value.trim();
        const f_name = document.getElementById('f_name').value.trim();
        if(!f_id || !f_name) return alert("⚠️ 工号和姓名必填！");
        
        const btn = document.getElementById('confirmWriteBtn');
        btn.innerText = "写入中..."; btn.disabled = true;

        const empData = {
            "工号": f_id, "姓名": f_name, "性别": document.getElementById('f_gender').value,
            "岗位": document.getElementById('f_pos').value, "站点": document.getElementById('f_dept').value,
            "班次": document.getElementById('f_shift').value, "上司工号": document.getElementById('f_manager').value,
            "邮箱": document.getElementById('f_email').value, "入职日期": document.getElementById('f_hire').value,
            "出生日期": document.getElementById('f_dob').value, "国籍": document.getElementById('f_nation').value,
            "办公室号": document.getElementById('f_office').value, "等级": document.getElementById('f_level').value,
            "办公地点": document.getElementById('f_location').value, "工作TG": document.getElementById('f_worktg').value,
            "私人TG": document.getElementById('f_privtg').value, "备注": document.getElementById('f_notes').value
        };

        try {
            const response = await fetch(SCRIPT_URL, { 
                method:'POST', 
                body: JSON.stringify({ action: 'saveEmployee', data: empData })
            });
            const result = await response.json();
            if(result.status === 'success') { 
                alert("✅ 写入成功！"); 
                clearForm();
                await loadEmployees(); 
            } else {
                alert("❌ 写入失败: " + result.msg);
            }
        } catch(e) { alert("网络错误: " + e.message); }
        btn.innerText = "💾 云端保存 (新增/修改)"; btn.disabled = false;
    }

    async function deleteEmployee(id) {
        if(!confirm(`⚠️ 警告：确定要永久删除工号 [${id}] 吗？此操作不可逆！`)) return;
        try {
            const response = await fetch(SCRIPT_URL, { 
                method:'POST', 
                body: JSON.stringify({ action: 'deleteEmployee', id: id })
            });
            const result = await response.json();
            if(result.status === 'success') { 
                alert("✅ 员工已删除"); 
                closeModal();
                await loadEmployees(); 
            } else { alert("❌ 删除失败: " + result.msg); }
        } catch(e) { alert("网络错误: " + e.message); }
    }

    /* ====== 辅助UI函数 ====== */
    function clearForm() { 
        document.querySelectorAll('#editorForm input, #editorForm textarea').forEach(i=>i.value=''); 
        document.getElementById('f_gender').value = '男';
        document.getElementById('f_shift').value = 'A班';
    }
    function togglePanel(id) { document.getElementById(id).classList.toggle(id==='leftPanel'?'hidden-left':'hidden-right'); }
    function closeModal() { document.getElementById('holoModal').style.display = 'none'; }
    function closeSettings() { document.getElementById('settingsOverlay').style.display = 'none'; }
    function openSettings() { if(currentUserEmail) document.getElementById('settingsOverlay').style.display = 'flex'; }
    
    // 初始化事件绑定
    document.getElementById('navStaffBtn').onclick = resetToFullView;
    document.getElementById('confirmWriteBtn').onclick = confirmWrite;
    document.getElementById('saveSettingsBtn').onclick = saveUserTheme;
    document.getElementById('verifyLoginBtn').onclick = verifyLogin;
    
    // 模态框初始化
    const modalDiv = document.createElement('div');
    modalDiv.id = 'holoModal';
    modalDiv.className = 'holo-overlay';
    modalDiv.onclick = (e) => { if(e.target === modalDiv) closeModal(); };
    modalDiv.innerHTML = '<div class="holo-dialog dynamic-border" id="modalContent"></div>';
    document.body.appendChild(modalDiv);
</script>
</body>
</html>
