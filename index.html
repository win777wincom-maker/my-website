<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MATRIX OS - 核心全息指挥中枢</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Orbitron', 'Share Tech Mono', system-ui; }
        
        :root {
            --bg-deep: #020616;
            --bg-surface: rgba(5, 14, 34, 0.75);
            --primary-glow: #00f0ff;
            --border-aura: rgba(0, 240, 255, 0.4);
            --text-bright: #eef5ff;
            --text-dim: #7da5d9;
            --card-bg: rgba(6, 18, 41, 0.65);
            --danger-neon: #ff2a6d;
            --success-glow: #39ff14;
        }

        body { background-color: var(--bg-deep); color: var(--text-bright); overflow-x: hidden; }
        
        /* 布局与导航 */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: var(--bg-surface); border-bottom: 1px solid var(--border-aura); box-shadow: 0 0 15px rgba(0,240,255,0.2); }
        .logo-area { font-size: 1.5rem; font-weight: bold; color: var(--primary-glow); text-shadow: 0 0 10px var(--primary-glow); }
        .header-controls { display: flex; gap: 15px; align-items: center; }
        
        /* UI组件库 */
        .matrix-btn { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--primary-glow); color: var(--primary-glow); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .matrix-btn:hover { background: var(--primary-glow); color: var(--bg-deep); box-shadow: 0 0 10px var(--primary-glow); }
        .matrix-btn.danger { border-color: var(--danger-neon); color: var(--danger-neon); }
        .matrix-btn.danger:hover { background: var(--danger-neon); color: white; box-shadow: 0 0 10px var(--danger-neon); }
        
        .matrix-input, .matrix-select { background: rgba(0,0,0,0.5); border: 1px solid var(--border-aura); color: var(--text-bright); padding: 8px 12px; border-radius: 4px; outline: none; }
        .matrix-input:focus { border-color: var(--primary-glow); box-shadow: 0 0 8px rgba(0,240,255,0.5); }
        
        /* 核心视图区 */
        .main-container { display: flex; height: calc(100vh - 65px); }
        .sidebar { width: 250px; background: var(--bg-surface); border-right: 1px solid var(--border-aura); padding: 20px; overflow-y: auto; }
        .sidebar-item { padding: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; border-radius: 4px; transition: 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background: rgba(0,240,255,0.1); border-color: var(--border-aura); color: var(--primary-glow); }
        
        .content-area { flex: 1; padding: 20px; overflow-y: auto; position: relative; }
        
        /* 工具栏：搜索与筛选 */
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-aura); }
        .search-group { display: flex; gap: 5px; flex: 1; }
        
        /* 数据表格视图 */
        .data-table { width: 100%; border-collapse: collapse; background: var(--card-bg); }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table th { color: var(--primary-glow); position: sticky; top: 0; background: #040a1a; z-index: 10; }
        .data-table tr:hover { background: rgba(0,240,255,0.05); }

        /* 切换架构：排班矩阵视图 */
        #shiftMatrixView { display: none; }
        .role-section { margin-bottom: 30px; }
        .role-title { font-size: 1.5rem; color: var(--primary-glow); border-bottom: 2px solid var(--primary-glow); padding-bottom: 10px; margin-bottom: 15px; text-shadow: 0 0 5px var(--primary-glow); }
        .site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .site-card { background: var(--card-bg); border: 1px solid var(--border-aura); border-radius: 8px; padding: 15px; }
        .site-card h3 { text-align: center; color: var(--text-bright); margin-bottom: 15px; }
        .shift-split { display: flex; gap: 15px; }
        .shift-col { flex: 1; background: rgba(0,0,0,0.4); border-radius: 6px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .shift-col h4 { text-align: center; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dashed var(--text-dim); }
        .shift-col.day h4 { color: #ffd700; }
        .shift-col.night h4 { color: #c0c0c0; }
        .shift-list { list-style: none; }
        .shift-list li { padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); font-size: 0.9rem; display: flex; justify-content: space-between;}
        
        /* 浮层与模态框 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal { background: var(--bg-surface); border: 1px solid var(--primary-glow); padding: 30px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 30px rgba(0,240,255,0.2); }
        .modal h2 { color: var(--primary-glow); margin-bottom: 20px; text-align: center; }
        
        /* 表单网格 */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full { grid-column: span 2; }

        /* 站点统计小弹窗 */
        .stats-panel { background: rgba(5,14,34,0.95); border: 1px solid var(--success-glow); padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(57,255,20,0.3); }
        .stats-panel h3 { color: var(--success-glow); border-bottom: 1px solid var(--success-glow); padding-bottom: 10px; margin-bottom: 10px; text-align: center; }
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px;}

        /* 白名单设置列表 */
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<header>
    <div class="logo-area">MATRIX OS <span style="font-size: 1rem; color: var(--text-dim);" id="roleDisplay"></span></div>
    <div class="header-controls">
        <button class="matrix-btn" onclick="toggleView()">切换视觉架构</button>
        <button class="matrix-btn admin-only" onclick="openSettings()">系统设置</button>
        <button class="matrix-btn danger" onclick="logout()">安全注销</button>
    </div>
</header>

<div class="main-container">
    <div class="sidebar">
        <div class="sidebar-item active" onclick="filterBySite('all')">🌐 全局核心网段 (全部)</div>
        <div id="siteNavList">
            </div>
    </div>

    <div class="content-area">
        <div class="toolbar">
            <div class="search-group">
                <select id="searchType" class="matrix-select" style="width: 120px;">
                    <option value="all">全字段匹配</option>
                    <option value="姓名">按 姓名</option>
                    <option value="工号">按 工号</option>
                    <option value="备注">按 备注</option>
                    <option value="岗位">按 岗位</option>
                </select>
                <input type="text" id="searchInput" class="matrix-input" placeholder="输入搜索指令..." onkeyup="executeSearch()">
            </div>
            <button class="matrix-btn admin-only" onclick="openEditor()">+ 录入新干员</button>
        </div>

        <div id="tableView">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>工号</th><th>姓名</th><th>岗位</th><th>站点</th><th>班次</th><th>入职日期</th><th>备注</th><th class="admin-only">操作</th>
                    </tr>
                </thead>
                <tbody id="employeeTbody">
                    </tbody>
            </table>
        </div>

        <div id="shiftMatrixView">
            </div>
    </div>
</div>

<div class="overlay" id="loginOverlay" style="display: flex;">
    <div class="modal" style="max-width: 400px;">
        <h2>系统安全验证</h2>
        <div class="form-group" style="margin-bottom: 15px;">
            <input type="text" id="loginEmail" class="matrix-input" placeholder="访问邮箱">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
            <input type="password" id="loginPassword" class="matrix-input" placeholder="密钥">
        </div>
        <button class="matrix-btn" style="width: 100%;" onclick="doLogin()">建立量子连接</button>
    </div>
</div>

<div class="overlay" id="editorOverlay">
    <div class="modal">
        <h2 id="editorTitle">录入新干员</h2>
        <div class="form-grid">
            <div class="form-group"><label>工号 (必填)</label><input type="text" id="f_id" class="matrix-input"></div>
            <div class="form-group"><label>姓名 (必填)</label><input type="text" id="f_name" class="matrix-input"></div>
            <div class="form-group"><label>性别</label>
                <select id="f_gender" class="matrix-select"><option>男</option><option>女</option></select>
            </div>
            <div class="form-group"><label>岗位</label>
                <select id="f_role" class="matrix-select"><option>助理</option><option>客服</option><option>出款</option></select>
            </div>
            <div class="form-group"><label>站点</label>
                <select id="f_site" class="matrix-select"></select>
            </div>
            <div class="form-group"><label>班次</label>
                <select id="f_shift" class="matrix-select"><option>白班</option><option>晚班</option></select>
            </div>
            <div class="form-group"><label>入职日期</label><input type="date" id="f_joinDate" class="matrix-input"></div>
            <div class="form-group"><label>出生日期</label><input type="date" id="f_birthDate" class="matrix-input"></div>
            <div class="form-group full"><label>备注说明</label><input type="text" id="f_remark" class="matrix-input"></div>
        </div>
        <div style="display: flex; gap: 15px; justify-content: flex-end;">
            <button class="matrix-btn danger" onclick="closeOverlay('editorOverlay')">取消</button>
            <button class="matrix-btn" onclick="saveEmployeeData()">保存上传</button>
        </div>
    </div>
</div>

<div class="overlay" id="settingsOverlay">
    <div class="modal">
        <h2>权限与站点配置</h2>
        
        <h3 style="color:var(--primary-glow); margin-top:20px;">站点管理</h3>
        <div style="display:flex; gap:10px; margin-bottom: 10px;">
            <input type="text" id="newSiteName" class="matrix-input" placeholder="输入新站点名称">
            <button class="matrix-btn" onclick="addSite()">添加站点</button>
        </div>
        <div id="settingsSiteList" style="margin-bottom: 20px; display:flex; gap:10px; flex-wrap:wrap;"></div>

        <h3 style="color:var(--primary-glow); margin-top:20px;">账号白名单</h3>
        <div style="display:flex; gap:10px; margin-bottom: 15px;">
            <input type="text" id="newAdminEmail" class="matrix-input" placeholder="邮箱账号">
            <select id="newAdminRole" class="matrix-select">
                <option value="管理员">管理员 (可编辑)</option>
                <option value="阅读者">阅读者 (仅查看)</option>
            </select>
            <button class="matrix-btn" onclick="addAdmin()">授权</button>
        </div>
        <div id="settingsAdminList" style="max-height: 200px; overflow-y:auto;"></div>
        
        <div style="margin-top: 20px; text-align: right;">
            <button class="matrix-btn danger" onclick="closeOverlay('settingsOverlay')">关闭</button>
            <button class="matrix-btn" onclick="saveConfigToServer()">保存系统配置</button>
        </div>
    </div>
</div>

<div class="overlay" id="statsOverlay">
    <div class="modal stats-panel" style="max-width: 350px;">
        <h3 id="statsTitle">站点动态统计</h3>
        <div id="statsContent"></div>
        <button class="matrix-btn" style="width:100%; margin-top:15px;" onclick="closeOverlay('statsOverlay')">确认</button>
    </div>
</div>

<script>
    // ⚠️ 在这里填入你的 Google App Script 部署 URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgK-T0ae8cr9zjmhjegqLgTe4RlNy086tVd7iw_CdABYtXTJj7XvirvwpEtJ-XPL1O/exec"; 

    // 全局状态库
    let globalEmployees = [];
    let globalSites = [];
    let globalAdmins = [];
    let currentSession = null;
    let isMatrixView = false;
    let activeSiteFilter = 'all';

    // 1. 初始化系统
    window.onload = () => {
        let savedSession = localStorage.getItem('matrix_session');
        if (savedSession) {
            currentSession = JSON.parse(savedSession);
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('roleDisplay').innerText = `[${currentSession.role}]`;
            applyRolePermissions();
            fetchSystemData();
        }
    };

    // 2. 身份与权限控制
    function applyRolePermissions() {
        let isReader = (currentSession.role === '阅读者');
        document.querySelectorAll('.admin-only').forEach(el => {
            el.style.display = isReader ? 'none' : '';
        });
    }

    function doLogin() {
        let email = document.getElementById('loginEmail').value;
        let pass = document.getElementById('loginPassword').value;
        if(!email || !pass) return alert('缺少安全验证信息');
        
        requestApi('verifyLogin', {email: email, password: pass}).then(res => {
            if(res.status === 'success') {
                currentSession = { email: res.email, role: res.role, name: res.nickname };
                localStorage.setItem('matrix_session', JSON.stringify(currentSession));
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('roleDisplay').innerText = `[${currentSession.role}]`;
                applyRolePermissions();
                fetchSystemData();
            } else {
                alert('验证失败: ' + res.msg);
            }
        });
    }

    function logout() {
        localStorage.removeItem('matrix_session');
        window.location.reload();
    }

    // 3. 通讯总线
    async function requestApi(action, data = {}) {
        let payload = { action: action, ...data };
        try {
            let response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch (e) {
            console.error('通信异常:', e);
            return {status: 'error', msg: '网络或通信异常'};
        }
    }

    function fetchSystemData() {
        requestApi('getConfig').then(res => {
            globalSites = res.sites || [];
            globalAdmins = res.admins || [];
            renderSidebar();
            
            // 填充表单站点下拉
            let siteSelect = document.getElementById('f_site');
            siteSelect.innerHTML = globalSites.map(s => `<option value="${s}">${s}</option>`).join('');
        });

        requestApi('getEmployees').then(res => {
            globalEmployees = res || [];
            renderEmployeeTable(globalEmployees);
            if(isMatrixView) renderShiftMatrix(globalEmployees);
        });
    }

    // 4. 视图渲染与控制
    function toggleView() {
        isMatrixView = !isMatrixView;
        document.getElementById('tableView').style.display = isMatrixView ? 'none' : 'block';
        document.getElementById('shiftMatrixView').style.display = isMatrixView ? 'block' : 'none';
        
        let displayData = filterLogic(activeSiteFilter, document.getElementById('searchInput').value);
        if (isMatrixView) {
            renderShiftMatrix(displayData);
        }
    }

    function renderSidebar() {
        let html = '';
        globalSites.forEach(site => {
            html += `<div class="sidebar-item" onclick="filterBySite('${site}')" ondblclick="showSiteStats('${site}')">📍 ${site}</div>`;
        });
        document.getElementById('siteNavList').innerHTML = html;
    }

    // 5. 核心筛选器 (解决搜索下拉框问题)
    function executeSearch() {
        let keyword = document.getElementById('searchInput').value;
        let data = filterLogic(activeSiteFilter, keyword);
        renderEmployeeTable(data);
        if(isMatrixView) renderShiftMatrix(data);
    }

    function filterBySite(site) {
        activeSiteFilter = site;
        let items = document.querySelectorAll('.sidebar-item');
        items.forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');
        
        let data = filterLogic(site, document.getElementById('searchInput').value);
        renderEmployeeTable(data);
        if(isMatrixView) renderShiftMatrix(data);

        // 如果点击的是具体站点，自动弹出该站点的统计面板
        if(site !== 'all') {
            showSiteStats(site);
        }
    }

    function filterLogic(site, keyword) {
        let type = document.getElementById('searchType').value;
        keyword = keyword.toLowerCase();
        
        return globalEmployees.filter(emp => {
            let siteMatch = (site === 'all') || (emp['站点'] === site);
            let searchMatch = true;
            
            if (keyword) {
                if (type === 'all') {
                    searchMatch = Object.values(emp).some(v => String(v).toLowerCase().includes(keyword));
                } else {
                    searchMatch = String(emp[type] || '').toLowerCase().includes(keyword);
                }
            }
            return siteMatch && searchMatch;
        });
    }

    // 6. 表格视图渲染
    function renderEmployeeTable(data) {
        let tbody = document.getElementById('employeeTbody');
        let html = '';
        let isReader = (currentSession.role === '阅读者');
        
        data.forEach(emp => {
            html += `<tr>
                <td>${emp['工号']}</td>
                <td>${emp['姓名']}</td>
                <td><span style="color:var(--primary-glow)">${emp['岗位']}</span></td>
                <td>${emp['站点']}</td>
                <td>${emp['班次']}</td>
                <td>${formatDate(emp['入职日期'])}</td>
                <td>${emp['备注'] || ''}</td>
                <td class="admin-only" style="display: ${isReader ? 'none' : 'table-cell'}">
                    <button class="matrix-btn" style="padding: 4px 8px; font-size:12px;" onclick='editEmployee(${JSON.stringify(emp).replace(/'/g, "&apos;")})'>修改</button>
                    <button class="matrix-btn danger" style="padding: 4px 8px; font-size:12px;" onclick="deleteEmployee('${emp['工号']}')">除名</button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    // 7. 排班矩阵视图渲染 (全新视觉架构)
    function renderShiftMatrix(data) {
        let container = document.getElementById('shiftMatrixView');
        let roles = ['客服', '出款']; // 只处理这两个特定岗位
        let html = '';

        roles.forEach(role => {
            let roleData = data.filter(e => e['岗位'] === role);
            if(roleData.length === 0) return;

            html += `<div class="role-section">
                        <div class="role-title">⟪ ${role} 部门 ⟫</div>
                        <div class="site-grid">`;
            
            // 按站点分组
            let siteGroups = {};
            roleData.forEach(e => {
                let s = e['站点'] || '未分配';
                if(!siteGroups[s]) siteGroups[s] = { day: [], night: [] };
                if(e['班次'] === '晚班') siteGroups[s].night.push(e);
                else siteGroups[s].day.push(e);
            });

            for (let site in siteGroups) {
                html += `<div class="site-card">
                            <h3>${site}</h3>
                            <div class="shift-split">
                                <div class="shift-col day">
                                    <h4>☀️ 白班 (${siteGroups[site].day.length})</h4>
                                    <ul class="shift-list">
                                        ${siteGroups[site].day.map(e => `<li><span>${e['姓名']}</span> <span style="color:var(--text-dim);font-size:0.8rem">${e['工号']}</span></li>`).join('')}
                                    </ul>
                                </div>
                                <div class="shift-col night">
                                    <h4>🌙 晚班 (${siteGroups[site].night.length})</h4>
                                    <ul class="shift-list">
                                        ${siteGroups[site].night.map(e => `<li><span>${e['姓名']}</span> <span style="color:var(--text-dim);font-size:0.8rem">${e['工号']}</span></li>`).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>`;
            }
            html += `   </div>
                      </div>`;
        });
        container.innerHTML = html;
    }

    // 8. 站点人数动态统计
    function showSiteStats(siteName) {
        let emps = globalEmployees.filter(e => e['站点'] === siteName);
        let stats = {
            '助理': { day: 0, night: 0 },
            '客服': { day: 0, night: 0 },
            '出款': { day: 0, night: 0 }
        };
        
        emps.forEach(e => {
            let role = e['岗位'];
            let shift = e['班次'];
            if(stats[role]) {
                if(shift === '晚班') stats[role].night++;
                else stats[role].day++;
            }
        });

        let html = `
            <div class="stats-row" style="color:var(--text-bright)"><span>岗位</span> <span>白班</span> <span>晚班</span></div>
            <div class="stats-row"><span>助理</span> <span style="color:#ffd700">${stats['助理'].day}</span> <span style="color:#c0c0c0">${stats['助理'].night}</span></div>
            <div class="stats-row"><span>客服</span> <span style="color:#ffd700">${stats['客服'].day}</span> <span style="color:#c0c0c0">${stats['客服'].night}</span></div>
            <div class="stats-row"><span>出款</span> <span style="color:#ffd700">${stats['出款'].day}</span> <span style="color:#c0c0c0">${stats['出款'].night}</span></div>
            <div class="stats-row" style="margin-top:10px; border-top:1px solid var(--success-glow); padding-top:10px;">
                <strong>总计人数</strong>
                <strong style="color:var(--primary-glow)">${emps.length} 人</strong>
            </div>
        `;
        document.getElementById('statsTitle').innerText = `【${siteName}】动态统计`;
        document.getElementById('statsContent').innerHTML = html;
        document.getElementById('statsOverlay').style.display = 'flex';
    }

    // 9. 编辑器与日期转换修复
    function formatDate(dateStr) {
        if (!dateStr) return '';
        let d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        let m = ('0' + (d.getMonth() + 1)).slice(-2);
        let day = ('0' + d.getDate()).slice(-2);
        return `${d.getFullYear()}-${m}-${day}`;
    }

    function openEditor() {
        document.getElementById('editorTitle').innerText = "录入新干员";
        document.querySelectorAll('#editorOverlay input').forEach(el => el.value = '');
        document.getElementById('editorOverlay').style.display = 'flex';
    }

    function editEmployee(emp) {
        document.getElementById('editorTitle').innerText = "修改干员配置";
        document.getElementById('f_id').value = emp['工号'];
        document.getElementById('f_name').value = emp['姓名'];
        document.getElementById('f_gender').value = emp['性别'];
        document.getElementById('f_role').value = emp['岗位'];
        document.getElementById('f_site').value = emp['站点'];
        document.getElementById('f_shift').value = emp['班次'];
        // 核心修复：必须转换为 YYYY-MM-DD 才能回显到 <input type="date">
        document.getElementById('f_joinDate').value = formatDate(emp['入职日期']);
        document.getElementById('f_birthDate').value = formatDate(emp['出生日期']);
        document.getElementById('f_remark').value = emp['备注'];
        
        document.getElementById('editorOverlay').style.display = 'flex';
    }

    function saveEmployeeData() {
        let id = document.getElementById('f_id').value;
        if(!id) return alert("工号不可为空");
        
        let data = {
            "工号": id,
            "姓名": document.getElementById('f_name').value,
            "性别": document.getElementById('f_gender').value,
            "岗位": document.getElementById('f_role').value,
            "站点": document.getElementById('f_site').value,
            "班次": document.getElementById('f_shift').value,
            "入职日期": document.getElementById('f_joinDate').value,
            "出生日期": document.getElementById('f_birthDate').value,
            "备注": document.getElementById('f_remark').value
        };

        requestApi('saveEmployee', { data: data }).then(res => {
            if(res.status === 'success') {
                closeOverlay('editorOverlay');
                fetchSystemData();
            } else alert("保存失败");
        });
    }

    function deleteEmployee(id) {
        if(confirm("警告：确认切断该干员的所有记录吗？")) {
            requestApi('deleteEmployee', { id: id }).then(res => {
                if(res.status === 'success') fetchSystemData();
            });
        }
    }

    // 10. 系统设置 (白名单乱码与权限修复)
    function openSettings() {
        renderSettingsData();
        document.getElementById('settingsOverlay').style.display = 'flex';
    }

    function renderSettingsData() {
        document.getElementById('settingsSiteList').innerHTML = globalSites.map((s, i) => 
            `<span class="matrix-btn" style="padding:4px 8px;">${s} <span style="color:var(--danger-neon); cursor:pointer; margin-left:8px;" onclick="removeSite(${i})">✖</span></span>`
        ).join('');
        
        // 修复乱码：显式读取对象属性，并明确展示管理员与阅读者身份
        document.getElementById('settingsAdminList').innerHTML = globalAdmins.map((a, i) => 
            `<div class="admin-item">
                <span>${a.email} <strong style="color:${a.role==='管理员'?'var(--primary-glow)':'var(--text-dim)'}">[${a.role}]</strong></span>
                <button class="matrix-btn danger" style="padding: 2px 8px; font-size:12px;" onclick="removeAdmin(${i})">移除</button>
            </div>`
        ).join('');
    }

    function addSite() {
        let site = document.getElementById('newSiteName').value.trim();
        if(site && !globalSites.includes(site)) {
            globalSites.push(site);
            document.getElementById('newSiteName').value = '';
            renderSettingsData();
        }
    }

    function removeSite(index) {
        globalSites.splice(index, 1);
        renderSettingsData();
    }

    function addAdmin() {
        let email = document.getElementById('newAdminEmail').value.trim();
        let role = document.getElementById('newAdminRole').value;
        if(email) {
            // 默认给个初始密码123456
            globalAdmins.push({ email: email, role: role, password: '123', nickname: email.split('@')[0] });
            document.getElementById('newAdminEmail').value = '';
            renderSettingsData();
        }
    }

    function removeAdmin(index) {
        globalAdmins.splice(index, 1);
        renderSettingsData();
    }

    function saveConfigToServer() {
        requestApi('saveConfig', { sites: globalSites, admins: globalAdmins }).then(res => {
            if(res.status === 'success') {
                closeOverlay('settingsOverlay');
                fetchSystemData();
                alert("配置已同步至主节点。");
            }
        });
    }

    // 辅助功能
    function closeOverlay(id) { document.getElementById(id).style.display = 'none'; }
</script>

</body>
</html>
