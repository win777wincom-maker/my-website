<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MATRIX OS - 全息指挥中枢</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Orbitron', system-ui; }
        :root {
            --bg-deep: #010514;
            --bg-surface: rgba(6, 16, 32, 0.65);
            --primary-glow: #00f0ff;
            --border-aura: rgba(0, 240, 255, 0.6);
            --text-bright: #eef5ff;
            --text-dim: #8db3e0;
            --card-bg: rgba(4, 12, 24, 0.5);
            --danger-neon: #ff2a6d;
            --success-glow: #39ff14;
            --gradient-1: #001155;
            --gradient-2: #0088ff;
            --glass-blur: 16px;
            --modal-bg: rgba(2, 10, 22, 0.90);
            --title-color: #00f0ff;
        }
        body.theme-light {
            --bg-deep: #f0f4f8;
            --bg-surface: rgba(255, 255, 255, 0.65);
            --primary-glow: #0055ff;
            --border-aura: #3b82f6;
            --text-bright: #0f172a;
            --text-dim: #475569;
            --card-bg: rgba(255, 255, 255, 0.7);
            --modal-bg: rgba(248, 250, 252, 0.95);
            --gradient-1: #93c5fd;
            --gradient-2: #e0f2fe;
            --title-color: #0055ff;
        }
        body { background-color: var(--bg-deep); color: var(--text-bright); font-size: 14px; height: 100vh; overflow: hidden; transition: background 0.4s, color 0.4s; }
        
        /* 动态极光渐变背景，去掉了网格 */
        .aurora-field { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: linear-gradient(125deg, var(--bg-deep) 0%, var(--gradient-1) 40%, var(--gradient-2) 60%, var(--bg-deep) 100%); 
            background-size: 300% 300%;
            animation: aurora-flow 12s ease-in-out infinite alternate;
            filter: blur(50px); opacity: 0.85; transition: background 0.4s; 
        }
        @keyframes aurora-flow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

        /* 高级极光动态边框 */
        .dynamic-border {
            border: 1px solid var(--border-aura);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 0 8px rgba(0,0,0,0.3);
            animation: borderPulse 3s infinite alternate;
        }
        @keyframes borderPulse {
            0% { border-color: var(--border-aura); box-shadow: 0 0 5px rgba(0, 240, 255, 0.05); }
            100% { border-color: var(--primary-glow); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        }

        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--primary-glow); border-radius: 10px; }
        
        .glass-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; backdrop-filter: blur(var(--glass-blur)); background: var(--bg-surface); z-index: 100; border-bottom: 1px solid var(--primary-glow);}
        .logo-area { display: flex; gap: 20px; align-items: center; }
        .neon-text { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; color: var(--title-color); text-shadow: 0 0 10px var(--title-color); transition: color 0.3s; }
        
        .hud-btn { background: var(--bg-surface); border: 1px solid var(--border-aura); color: var(--primary-glow); padding: 6px 16px; cursor: pointer; border-radius: 20px; transition: 0.3s; font-weight: bold; backdrop-filter: blur(4px); display: inline-flex; align-items: center; justify-content: center; gap: 6px;}
        .hud-btn:hover, .hud-btn.active { background: var(--primary-glow); color: #fff; box-shadow: 0 0 15px var(--primary-glow); border-color: transparent;}
        
        .theme-picker { display: flex; gap: 8px; margin-left: 15px; }
        .theme-icon { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border-aura); transition: 0.2s; }
        .theme-icon.dark { background: #010514; box-shadow: 0 0 6px #00f0ff; }
        .theme-icon.light { background: #eef2ff; box-shadow: 0 0 6px #3b82f6; }
        
        .search-box { background: rgba(0,0,0,0.1); border: 1px solid var(--border-aura); color: var(--text-bright); padding: 8px 16px; border-radius: 20px; outline: none; width: 220px; transition: 0.3s; backdrop-filter: blur(4px);}
        .search-box:focus { border-color: var(--primary-glow); box-shadow: 0 0 12px var(--primary-glow); }

        .dashboard-layout { display: flex; height: calc(100vh - 65px); overflow: hidden; position: relative;}
        .side-panel { width: 260px; backdrop-filter: blur(var(--glass-blur)); background: var(--bg-surface); padding: 20px 12px; overflow-y: auto; transition: transform 0.3s, margin 0.3s; flex-shrink:0; }
        .right-panel { width: 400px; }
        .hidden-left { transform: translateX(-100%); margin-left: -260px; }
        .hidden-right { transform: translateX(100%); margin-right: -400px; }
        .main-stage { flex: 1; padding: 20px; overflow-y: auto; position: relative;}
        
        .section-title { font-size: 1.1rem; border-left: 4px solid var(--primary-glow); padding-left: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; color: var(--text-bright); font-weight:bold;}
        
        /* 视图容器: Grid, List, Tree */
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .staff-list { display: flex; flex-direction: column; gap: 8px; }
        .staff-tree { display: flex; flex-wrap: wrap; gap: 12px; padding-left: 20px; border-left: 2px dashed var(--border-aura); }
        
        .staff-card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.3s; overflow: hidden; }
        .staff-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); border-color: var(--primary-glow); }
        
        .staff-card.list-mode { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .staff-card.list-mode .staff-meta { margin: 0; }
        .staff-card.tree-mode { padding: 8px 16px; min-width: 150px; text-align:center; }
        .staff-card.tree-mode .staff-meta { display: none; }

        .card-site { font-size: 0.7rem; color: var(--primary-glow); margin-bottom: 8px; display: flex; justify-content: space-between; font-weight:bold;}
        .staff-name { font-size: 1.25rem; font-weight: bold; display: flex; align-items: baseline; gap: 8px; margin: 8px 0; color: var(--text-bright); }
        .staff-role { font-size: 0.75rem; background: rgba(0,240,255,0.15); display: inline-block; padding: 4px 12px; border-radius: 14px; color: var(--text-bright); border: 1px solid var(--border-aura);}
        .staff-meta { margin-top: 12px; font-size: 0.75rem; display: flex; justify-content: space-between; color: var(--text-dim); }
        
        .site-menu-item { display: flex; flex-direction: column; margin-bottom: 10px; }
        .site-shifts { display: none; padding-left: 20px; margin-top: 8px; gap: 6px; flex-direction: column; }
        .site-shifts.active { display: flex; }
        .shift-btn { font-size: 0.85rem; background: transparent; border: 1px dashed var(--border-aura); color: var(--text-bright); padding: 6px; border-radius: 6px; cursor: pointer; transition: 0.2s; text-align: left; }
        .shift-btn:hover { background: var(--primary-glow); color: #fff; border-style: solid; }

        .holo-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .holo-dialog { width: 650px; max-width: 95%; background: var(--modal-bg); border-radius: 16px; padding: 30px; animation: floatIn 0.3s ease; color: var(--text-bright);}
        @keyframes floatIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .stat-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase;}
        .stat-value-text { font-size: 1rem; font-weight: 500; }
        
        .tech-input, select { background: rgba(0,0,0,0.2); border: 1px solid var(--border-aura); color: var(--text-bright); padding: 10px; border-radius: 8px; width: 100%; outline: none; transition: 0.3s; }
        .tech-input:focus, select:focus { border-color: var(--primary-glow); box-shadow: 0 0 10px var(--border-aura); background: rgba(0,0,0,0.4); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        
        /* 仪表盘卡片 */
        .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .dash-card { background: var(--card-bg); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .dash-card:hover { transform: translateY(-3px); box-shadow: 0 0 15px var(--border-aura); }
        .dash-val { font-size: 1.8rem; font-weight: bold; color: var(--primary-glow); margin-top: 5px; }
        .dash-title { font-size: 0.8rem; color: var(--text-dim); }
    </style>
</head>
<body>
<div class="aurora-field" id="auroraBg"></div>

<div id="loginOverlay" class="holo-overlay" style="display: flex; z-index: 9999;">
    <div class="holo-dialog dynamic-border" style="text-align:center; width: 380px;">
        <h2 style="color:var(--primary-glow); letter-spacing: 2px;">MATRIX OS</h2>
        <p style="color:var(--text-dim); margin-bottom: 20px;">全息指挥中枢 · 身份验证</p>
        <input type="email" id="loginEmail" class="tech-input" style="margin-bottom:15px;" placeholder="账号邮箱">
        <input type="password" id="loginPwd" class="tech-input" style="margin-bottom:25px;" placeholder="登录密码">
        <button class="hud-btn" id="verifyLoginBtn" style="width: 100%; padding: 10px; font-size:1.1rem;">接入系统</button>
    </div>
</div>

<div id="profileOverlay" class="holo-overlay" style="z-index: 3000;">
    <div class="holo-dialog dynamic-border" style="width: 400px;">
        <div class="section-title">👤 个人中心</div>
        <div class="form-grid" style="grid-template-columns: 1fr; gap: 15px;">
            <div><label class="stat-label">当前邮箱</label><input type="text" id="profEmail" class="tech-input" disabled></div>
            <div><label class="stat-label">昵称修改</label><input type="text" id="profNick" class="tech-input"></div>
            <div><label class="stat-label">重置密码 (留空不修改)</label><input type="password" id="profPwd" class="tech-input" placeholder="输入新密码"></div>
            <button class="hud-btn" onclick="saveProfile()" style="width:100%; margin-top:10px;">💾 保存资料</button>
            <button class="hud-btn" onclick="logout()" style="width:100%; border-color:var(--danger-neon); color:var(--danger-neon);">🚪 退出登录</button>
            <button class="hud-btn" onclick="closeProfile()" style="width:100%; background:transparent;">取消</button>
        </div>
    </div>
</div>

<div id="settingsOverlay" class="holo-overlay" style="z-index: 2500;">
    <div class="holo-dialog dynamic-border" style="width: 500px;">
        <div class="section-title">🎨 全息视觉引擎配置</div>
        <div class="form-grid" style="grid-template-columns: 1fr; gap: 15px; max-height: 50vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center;"><span>系统全局标题</span><input type="text" id="customTitle" class="tech-input" style="width: 250px;"></div>
            <div style="display:flex; justify-content:space-between; align-items:center;"><span>标题文字发光色</span><input type="color" id="customTitleColor" class="tech-input" style="width: 100px; padding:0; height:40px;"></div>
            <div style="display:flex; justify-content:space-between; align-items:center;"><span>UI主发光色</span><input type="color" id="customPrimary" class="tech-input" style="width: 100px; padding:0; height:40px;"></div>
        </div>
        <div style="display: flex; gap:10px; margin-top: 25px;">
            <button class="hud-btn" id="saveSettingsBtn" style="flex:1;">✅ 应用视觉方案</button>
            <button class="hud-btn" onclick="document.getElementById('settingsOverlay').style.display='none'" style="flex:1;">取消</button>
        </div>
    </div>
</div>

<header class="glass-header dynamic-border">
    <div class="logo-area">
        <button class="hud-btn" onclick="togglePanel('leftPanel')">◧ 站点矩阵</button>
        <span class="neon-text" id="mainTitle">MATRIX OS · 全息指挥中枢</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索工号 / 姓名..." oninput="handleSearch()">
        <button class="hud-btn" onclick="toggleDashboard()">📊 数据看板</button>
        <button class="hud-btn" onclick="cycleLayout()">👁️ 切换视图</button>
        <div class="theme-picker">
            <div class="theme-icon dark" onclick="setThemePreset('dark')" title="深色极光"></div>
            <div class="theme-icon light" onclick="setThemePreset('light')" title="浅色极光"></div>
        </div>
        <button class="hud-btn" onclick="openSettings()" title="颜色配置">🎨</button>
        <button class="hud-btn" id="navStaffBtn">🌌 全站</button>
        <button class="hud-btn" onclick="togglePanel('rightPanel')">录入终端 ◨</button>
        <button class="hud-btn" onclick="openProfile()" id="userNickBtn">👤 访客</button>
    </div>
</header>

<div class="dashboard-layout">
    <div class="side-panel dynamic-border" id="leftPanel">
        <div class="section-title">🚀 动态部署站点</div>
        <div class="site-menu-item">
            <button class="hud-btn" style="width:100%; justify-content:flex-start;" onclick="filterGlobalShift('all')">🌐 全站 · 完整视图</button>
        </div>
        <div class="site-menu-item">
            <button class="hud-btn" style="width:100%; justify-content:flex-start;" onclick="filterGlobalShift('A班')">🔸 全站 · A班过滤</button>
        </div>
        <div class="site-menu-item" style="margin-bottom: 20px;">
            <button class="hud-btn" style="width:100%; justify-content:flex-start;" onclick="filterGlobalShift('B班')">🔸 全站 · B班过滤</button>
        </div>
        <div id="siteList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
    
    <div class="main-stage" id="mainStage">
        <div id="dashboardArea" style="display:none; margin-bottom:30px;">
            <div class="section-title">📈 矩阵数据中枢</div>
            <div class="dash-grid" id="roleDashGrid"></div>
            <div class="section-title">⏳ 司龄分布监测</div>
            <div class="dash-grid" id="tenureDashGrid"></div>
        </div>

        <div id="staffViewArea">
            <div class="section-title" style="border-color:var(--success-glow);">
                <span id="currentViewTitle">👥 全息员工矩阵</span>
                <button class="hud-btn" style="font-size:12px; padding:2px 10px; display:none;" id="resetFilterBtn" onclick="resetToFullView()">↺ 重置过滤</button>
            </div>
            <div id="hierarchyContainer"></div>
        </div>
    </div>
    
    <div class="side-panel right-panel hidden-right dynamic-border" id="rightPanel">
        <div class="section-title" style="color:var(--primary-glow);">⚡ 量子录入终端</div>
        <div class="form-grid" id="editorForm">
            <input type="text" id="f_id" placeholder="工号*" class="tech-input">
            <input type="text" id="f_name" placeholder="姓名*" class="tech-input">
            <select id="f_gender" class="tech-input"><option>男</option><option>女</option></select>
            <input type="text" id="f_pos" placeholder="岗位" class="tech-input">
            <input type="text" id="f_dept" placeholder="站点" class="tech-input">
            <select id="f_shift" class="tech-input"><option>A班</option><option>B班</option><option>全班</option></select>
            <input type="text" id="f_manager" placeholder="上司工号" class="tech-input">
            <input type="text" id="f_email" placeholder="邮箱" class="tech-input">
            <div style="grid-column:1; display:flex; flex-direction:column;"><label style="font-size:10px;color:var(--text-dim);">入职日期</label><input type="date" id="f_hire" class="tech-input"></div>
            <div style="grid-column:2; display:flex; flex-direction:column;"><label style="font-size:10px;color:var(--text-dim);">出生日期</label><input type="date" id="f_dob" class="tech-input"></div>
            <input type="text" id="f_nation" placeholder="国籍" class="tech-input">
            <input type="text" id="f_office" placeholder="办公室号" class="tech-input">
            <input type="text" id="f_level" placeholder="等级" class="tech-input">
            <input type="text" id="f_location" placeholder="办公地点" class="tech-input">
            <input type="text" id="f_worktg" placeholder="工作TG (@账号)" class="tech-input">
            <input type="text" id="f_privtg" placeholder="私人TG (@账号)" class="tech-input">
            <textarea id="f_notes" placeholder="备注" class="tech-input" style="grid-column:1/-1; height: 80px;"></textarea>
        </div>
        <div id="adminWriteZone" style="display:none; margin-top:20px; flex-direction:column; gap:12px;">
            <button class="hud-btn" id="confirmWriteBtn" style="width:100%; border-color:var(--success-glow); color:var(--success-glow); font-size:1.1rem; padding:10px;">💾 同步至云端矩阵</button>
            <button class="hud-btn" onclick="clearForm()" style="width:100%;">🧹 重置终端缓存</button>
        </div>
        <div id="readonlyMsg" style="display:none; text-align:center; margin-top:20px; color:var(--danger-neon); border: 1px dashed var(--danger-neon); padding: 10px; border-radius: 8px;">🔒 您的权限不足，仅允许观测数据</div>
    </div>
</div>

<script>
    // ⚠️ 替换为你刚才部署的 Google Apps Script URL ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzgK-T0ae8cr9zjmhjegqLgTe4RlNy086tVd7iw_CdABYtXTJj7XvirvwpEtJ-XPL1O/exec";

    let globalEmployees = [];
    let currentUser = { email: "", role: "Viewer", nickname: "访客" };
    let currentFilter = { type: "all", shift: null, site: null, search: "", role: null, tenure: null };
    let currentLayout = "grid"; // grid, list, tree
    let showDash = false;
    
    const roleOrder = ["主管", "助理", "助手", "客服组长", "客服", "出款组长", "出款", "其他"];
    
    function getRoleGroup(role) {
        if (!role) return "其他";
        if (role.includes("主管")) return "主管";
        if (role.includes("助理")) return "助理";
        if (role.includes("助手")) return "助手";
        if (role.includes("客服组长")) return "客服组长";
        if (role.includes("客服")) return "客服";
        if (role.includes("出款组长")) return "出款组长";
        if (role.includes("出款")) return "出款";
        return "其他";
    }

    // 司龄计算
    function getTenureCategory(dateString) {
        if(!dateString) return 'unknown';
        let d = new Date(dateString);
        if(isNaN(d)) return 'unknown';
        let months = (new Date() - d) / (1000 * 60 * 60 * 24 * 30.44); 
        if(months < 3) return 'new';
        if(months >= 6 && months < 12) return '6m1y';
        if(months >= 12 && months < 24) return '1y';
        if(months >= 24) return '2y';
        return 'other'; // 3-6个月等其他情况
    }

    /* ====== 核心数据交互 ====== */
    async function apiCall(action, payload = {}) {
        const req = { action: action, ...payload };
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                // 使用纯文本防止复杂 CORS 预检
                body: JSON.stringify(req)
            });
            return await response.json();
        } catch(e) {
            console.error("API Call Error:", e);
            alert("通信异常，请检查网络");
            return { status: 'error', msg: 'Network Error' };
        }
    }

    async function verifyLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPwd').value.trim();
        if(!email || !pwd) return alert("信息不完整");
        
        const btn = document.getElementById('verifyLoginBtn');
        btn.innerText = "量子信道连接中..."; btn.disabled = true;
        
        const res = await apiCall('login', { email: email, password: pwd });
        if(res.status === 'success' && res.allowed) {
            currentUser = { email: email, role: res.role, nickname: res.nickname || "指挥官" };
            document.getElementById('userNickBtn').innerText = `👤 ${currentUser.nickname}`;
            document.getElementById('loginOverlay').style.display = 'none';
            
            if(currentUser.role === 'Admin') {
                document.getElementById('adminWriteZone').style.display = 'flex';
                document.getElementById('readonlyMsg').style.display = 'none';
            } else {
                document.getElementById('adminWriteZone').style.display = 'none';
                document.getElementById('readonlyMsg').style.display = 'block';
            }
            
            loadUserTheme();
            await loadEmployees();
        } else { 
            alert(res.msg || "身份拒绝验证"); 
        }
        btn.innerText = "接入系统"; btn.disabled = false;
    }

    function logout() {
        currentUser = { email: "", role: "Viewer", nickname: "访客" };
        document.getElementById('profileOverlay').style.display = 'none';
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('loginPwd').value = '';
        globalEmployees = [];
        document.getElementById('hierarchyContainer').innerHTML = '';
    }

    async function loadEmployees() {
        try {
            // GET 请求获取数据
            const resp = await fetch(`${SCRIPT_URL}?action=getEmployees`);
            const data = await resp.json();
            globalEmployees = Array.isArray(data) ? data : [];
            renderSiteList();
            updateDashboardStats();
            renderHierarchy();
        } catch (error) {
            console.error("Load Error", error);
        }
    }

    /* ====== 个人中心 ====== */
    function openProfile() {
        document.getElementById('profEmail').value = currentUser.email;
        document.getElementById('profNick').value = currentUser.nickname;
        document.getElementById('profPwd').value = '';
        document.getElementById('profileOverlay').style.display = 'flex';
    }
    function closeProfile() { document.getElementById('profileOverlay').style.display = 'none'; }
    async function saveProfile() {
        const nick = document.getElementById('profNick').value.trim();
        const pwd = document.getElementById('profPwd').value.trim();
        const res = await apiCall('updateProfile', { email: currentUser.email, nickname: nick, newPwd: pwd });
        if(res.status === 'success') {
            alert("个人资料更新成功！");
            if(nick) {
                currentUser.nickname = nick;
                document.getElementById('userNickBtn').innerText = `👤 ${nick}`;
            }
            closeProfile();
        } else alert("更新失败: " + res.msg);
    }

    /* ====== 看板与统计 ====== */
    function toggleDashboard() {
        showDash = !showDash;
        document.getElementById('dashboardArea').style.display = showDash ? 'block' : 'none';
        if(showDash) updateDashboardStats();
    }

    function updateDashboardStats() {
        let stats = { 全员: globalEmployees.length };
        roleOrder.forEach(r => stats[r] = 0);
        let tenures = { new:0, '6m1y':0, '1y':0, '2y':0 };
        
        globalEmployees.forEach(emp => {
            const g = getRoleGroup(emp['岗位']);
            if(stats[g] !== undefined) stats[g]++;
            
            const t = getTenureCategory(emp['入职日期']);
            if(tenures[t] !== undefined) tenures[t]++;
        });

        document.getElementById('roleDashGrid').innerHTML = `
            <div class="dash-card dynamic-border" onclick="filterByDash('role', 'all')"><div class="dash-title">全站矩阵人数</div><div class="dash-val">${stats['全员']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('role', '主管')"><div class="dash-title">主管团队</div><div class="dash-val">${stats['主管']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('role', '助理')"><div class="dash-title">助理团队</div><div class="dash-val">${stats['助理']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('role', '助手')"><div class="dash-title">助手团队</div><div class="dash-val">${stats['助手']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('role', '客服组长')"><div class="dash-title">客服组长</div><div class="dash-val">${stats['客服组长']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('role', '客服')"><div class="dash-title">客服专员</div><div class="dash-val">${stats['客服']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('role', '出款组长')"><div class="dash-title">出款组长</div><div class="dash-val">${stats['出款组长']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('role', '出款')"><div class="dash-title">出款审核</div><div class="dash-val">${stats['出款']}</div></div>
        `;
        
        document.getElementById('tenureDashGrid').innerHTML = `
            <div class="dash-card dynamic-border" onclick="filterByDash('tenure', 'new')"><div class="dash-title">新人 (3个月内)</div><div class="dash-val">${tenures['new']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('tenure', '6m1y')"><div class="dash-title">稳定 (6个月-1年)</div><div class="dash-val">${tenures['6m1y']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('tenure', '1y')"><div class="dash-title">资深 (1年以上)</div><div class="dash-val">${tenures['1y']}</div></div>
            <div class="dash-card dynamic-border" onclick="filterByDash('tenure', '2y')"><div class="dash-title">元老 (2年以上)</div><div class="dash-val">${tenures['2y']}</div></div>
        `;
    }

    function filterByDash(type, val) {
        resetToFullView(false); // 重置但不重新渲染
        if(val !== 'all') {
            if(type === 'role') currentFilter.role = val;
            if(type === 'tenure') currentFilter.tenure = val;
            document.getElementById('resetFilterBtn').style.display = 'inline-block';
        }
        renderHierarchy();
    }

    /* ====== 站点导航 ====== */
    function renderSiteList() {
        const sites = [...new Set(globalEmployees.map(e=>e['站点']).filter(Boolean))];
        const container = document.getElementById('siteList');
        container.innerHTML = '';
        sites.forEach((site, index) => {
            const safeSite = site.replace(/'/g, "\\'");
            container.innerHTML += `
            <div class="site-menu-item">
                <button class="hud-btn" style="width:100%; justify-content:flex-start;" onclick="toggleSiteShifts(${index}, '${safeSite}')">📡 站点: ${site} ▼</button>
                <div class="site-shifts dynamic-border" style="border-radius:6px; padding: 10px; margin-top:5px;" id="shifts-for-${index}">
                    <button class="shift-btn" onclick="filterBySite('${safeSite}', null)">🔹 全部班次查看</button>
                    <button class="shift-btn" onclick="filterBySite('${safeSite}', 'A班')">🔸 A班 矩阵</button>
                    <button class="shift-btn" onclick="filterBySite('${safeSite}', 'B班')">🔸 B班 矩阵</button>
                </div>
            </div>`;
        });
    }

    function toggleSiteShifts(index, site) {
        document.querySelectorAll('.site-shifts').forEach(el => el.classList.remove('active'));
        document.getElementById(`shifts-for-${index}`).classList.toggle('active');
        filterBySite(site, null);
    }
    
    function filterGlobalShift(shift) {
        resetToFullView(false);
        if(shift !== 'all') currentFilter.shift = shift;
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = shift !== 'all' ? 'inline-block' : 'none';
    }

    function filterBySite(site, shift = null) {
        resetToFullView(false);
        currentFilter.site = site;
        currentFilter.shift = shift;
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = 'inline-block';
    }
    
    function resetToFullView(render = true) {
        currentFilter = { type: "all", site: null, shift: null, search: "", role: null, tenure: null };
        document.getElementById('searchInput').value = "";
        document.getElementById('resetFilterBtn').style.display = 'none';
        document.querySelectorAll('.site-shifts').forEach(el => el.classList.remove('active'));
        if(render) renderHierarchy();
    }

    function handleSearch() {
        currentFilter.search = document.getElementById('searchInput').value.trim().toLowerCase();
        renderHierarchy();
        document.getElementById('resetFilterBtn').style.display = currentFilter.search ? 'inline-block' : 'none';
    }

    function cycleLayout() {
        if(currentLayout === 'grid') currentLayout = 'list';
        else if(currentLayout === 'list') currentLayout = 'tree';
        else currentLayout = 'grid';
        renderHierarchy();
    }

    /* ====== 视图渲染 ====== */
    function renderHierarchy() {
        let filtered = [...globalEmployees];
        
        if(currentFilter.site) filtered = filtered.filter(e => e['站点'] === currentFilter.site);
        if(currentFilter.shift) filtered = filtered.filter(e => e['班次'] === currentFilter.shift);
        if(currentFilter.role) filtered = filtered.filter(e => getRoleGroup(e['岗位']) === currentFilter.role);
        if(currentFilter.tenure) filtered = filtered.filter(e => getTenureCategory(e['入职日期']) === currentFilter.tenure);
        if(currentFilter.search) {
            filtered = filtered.filter(e => 
                (e['姓名'] && String(e['姓名']).toLowerCase().includes(currentFilter.search)) ||
                (e['工号'] && String(e['工号']).toLowerCase().includes(currentFilter.search))
            );
        }
        
        const groups = {}; roleOrder.forEach(r => groups[r] = []);
        filtered.forEach(emp => { 
            const g = getRoleGroup(emp['岗位']); 
            if(groups[g]) groups[g].push(emp); else groups['其他'].push(emp); 
        });
        
        const container = document.getElementById('hierarchyContainer');
        container.innerHTML = '';
        
        let containerClass = "staff-grid";
        if(currentLayout === 'list') containerClass = "staff-list";
        if(currentLayout === 'tree') containerClass = "staff-tree";

        let totalRendered = 0;
        roleOrder.forEach(key => {
            if(groups[key].length > 0) {
                totalRendered += groups[key].length;
                const groupDiv = document.createElement('div');
                groupDiv.style.marginBottom = "24px";
                groupDiv.innerHTML = `<div style="font-size: 0.85rem; letter-spacing: 2px; color: var(--primary-glow); margin-bottom: 12px; font-weight:bold; border-bottom: 1px solid var(--border-aura); padding-bottom:5px; display:inline-block;">❖ ${key} 团队 (${groups[key].length})</div><div class="${containerClass}"></div>`;
                container.appendChild(groupDiv);
                
                const gridDiv = groupDiv.querySelector(`.${containerClass}`);
                groups[key].forEach(emp => gridDiv.appendChild(createStaffCard(emp)));
            }
        });
        
        if(totalRendered === 0) {
            container.innerHTML = `<div style="text-align:center; margin-top: 50px; color: var(--text-dim);">该筛选条件下没有人员记录</div>`;
        }

        // 标题动态修改
        let t = "👥 全息矩阵";
        if(currentFilter.site) t += ` · ${currentFilter.site}`;
        if(currentFilter.shift) t += ` (${currentFilter.shift})`;
        if(currentFilter.role) t += ` [${currentFilter.role}筛选]`;
        document.getElementById('currentViewTitle').innerHTML = t;
    }
    
    function createStaffCard(emp) {
        const card = document.createElement('div');
        card.className = `staff-card dynamic-border ${currentLayout}-mode`;
        card.onclick = () => showEmployeeProfile(emp);
        
        if (currentLayout === 'grid' || currentLayout === 'tree') {
            card.innerHTML = `
                <div class="card-site"><span>${emp['站点']||'-'}</span><span>${emp['班次']||''}</span></div>
                <div class="staff-name">${emp['姓名']||'?'}<small style="color:var(--text-dim);font-size:0.8rem;">#${emp['工号']||''}</small></div>
                <div class="staff-role">${emp['岗位']||'员工'}</div>
                <div class="staff-meta"><span>入职: ${emp['入职日期']||'-'}</span><span style="color:var(--success-glow);">${emp['工作TG']||''}</span></div>
            `;
        } else {
            card.innerHTML = `
                <div style="display:flex; gap:20px; align-items:center;">
                    <strong style="width:120px; color:var(--text-bright);">${emp['姓名']}</strong>
                    <span style="width:80px; color:var(--text-dim);">#${emp['工号']}</span>
                    <span class="staff-role" style="width:100px; text-align:center;">${emp['岗位']}</span>
                    <span style="color:var(--primary-glow); font-size:0.85rem; width:150px;">${emp['站点']||'-'} / ${emp['班次']||'-'}</span>
                    <span style="color:var(--success-glow); font-size:0.85rem;">工作TG: ${emp['工作TG']||'-'}</span>
                </div>
            `;
        }
        return card;
    }

    /* ====== 资料弹窗 ====== */
    function showEmployeeProfile(emp) {
        const modal = document.getElementById('holoModal');
        const content = document.getElementById('modalContent');
        
        content.innerHTML = `
            <h2 style="color:var(--primary-glow); margin-bottom:20px; border-bottom: 2px dashed var(--border-aura); padding-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                <span>🧬 员工全息档案</span>
                <span style="font-size:1rem; color:var(--text-bright);">${emp['姓名']} (#${emp['工号']})</span>
            </h2>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom: 25px;">
                <div><div class="stat-label">岗位 / 等级</div><div class="stat-value-text">${emp['岗位']||'-'} / ${emp['等级']||'-'}</div></div>
                <div><div class="stat-label">站点 / 班次</div><div class="stat-value-text">${emp['站点']||'-'} / ${emp['班次']||'-'}</div></div>
                <div><div class="stat-label">上司工号</div><div class="stat-value-text">${emp['上司工号']||'-'}</div></div>
                <div><div class="stat-label">性别 / 国籍</div><div class="stat-value-text">${emp['性别']||'-'} / ${emp['国籍']||'-'}</div></div>
                <div><div class="stat-label">入职日期</div><div class="stat-value-text">${emp['入职日期']||'-'}</div></div>
                <div><div class="stat-label">出生日期</div><div class="stat-value-text">${emp['出生日期']||'-'}</div></div>
                <div><div class="stat-label">办公室 / 地点</div><div class="stat-value-text">${emp['办公室号']||'-'} / ${emp['办公地点']||'-'}</div></div>
                <div><div class="stat-label">邮箱</div><div class="stat-value-text">${emp['邮箱']||'-'}</div></div>
                <div><div class="stat-label">工作 TG</div><div class="stat-value-text" style="color:var(--success-glow);">${emp['工作TG']||'-'}</div></div>
                <div><div class="stat-label">私人 TG</div><div class="stat-value-text">${emp['私人TG']||'-'}</div></div>
                <div style="grid-column:1/-1;"><div class="stat-label">备 注信 息</div><div class="stat-value-text">${emp['备注']||'无'}</div></div>
            </div>
            <div style="display:flex; gap:15px; justify-content:flex-end;">
                ${currentUser.role === 'Admin' ? `<button class="hud-btn" style="border-color:var(--danger-neon); color:var(--danger-neon);" onclick="deleteEmployee('${emp['工号']}')">🗑️ 摧毁档案</button>` : ''}
                ${currentUser.role === 'Admin' ? `<button class="hud-btn" onclick="fillFormForEdit('${emp['工号']}')">✏️ 提取编辑</button>` : ''}
                <button class="hud-btn" onclick="closeModal()">✖ 结束观测</button>
            </div>
        `;
        modal.style.display = 'flex';
    }

    function fillFormForEdit(id) {
        closeModal();
        const emp = globalEmployees.find(e => String(e['工号']) === String(id));
        if(!emp) return;
        document.getElementById('rightPanel').classList.remove('hidden-right');
        
        // 严格按照17列表头顺序
        const fields = ["工号", "姓名", "性别", "岗位", "站点", "班次", "上司工号", "邮箱", "入职日期", "出生日期", "国籍", "办公室号", "等级", "办公地点", "工作TG", "私人TG", "备注"];
        const ids = ["f_id", "f_name", "f_gender", "f_pos", "f_dept", "f_shift", "f_manager", "f_email", "f_hire", "f_dob", "f_nation", "f_office", "f_level", "f_location", "f_worktg", "f_privtg", "f_notes"];
        
        fields.forEach((f, i) => {
            const el = document.getElementById(ids[i]);
            if (el) el.value = emp[f] || '';
        });
    }

    /* ====== 写入与删除 ====== */
    async function confirmWrite() {
        if(currentUser.role !== 'Admin') return alert("权限拒绝");
        const f_id = document.getElementById('f_id').value.trim();
        const f_name = document.getElementById('f_name').value.trim();
        if(!f_id || !f_name) return alert("⚠️ 工号和姓名必须填写！");
        
        const btn = document.getElementById('confirmWriteBtn');
        btn.innerText = "数据同步中..."; btn.disabled = true;

        const empData = {
            "工号": f_id, "姓名": f_name, "性别": document.getElementById('f_gender').value,
            "岗位": document.getElementById('f_pos').value, "站点": document.getElementById('f_dept').value,
            "班次": document.getElementById('f_shift').value, "上司工号": document.getElementById('f_manager').value,
            "邮箱": document.getElementById('f_email').value, "入职日期": document.getElementById('f_hire').value,
            "出生日期": document.getElementById('f_dob').value, "国籍": document.getElementById('f_nation').value,
            "办公室号": document.getElementById('f_office').value, "等级": document.getElementById('f_level').value,
            "办公地点": document.getElementById('f_location').value, "工作TG": document.getElementById('f_worktg').value,
            "私人TG": document.getElementById('f_privtg').value, "备注": document.getElementById('f_notes').value
        };

        const res = await apiCall('saveEmployee', { data: empData });
        if(res.status === 'success') { 
            alert("✅ 数据云端同步完成！"); 
            clearForm();
            await loadEmployees(); 
        } else {
            alert("❌ 同步失败: " + res.msg);
        }
        btn.innerText = "💾 同步至云端矩阵"; btn.disabled = false;
    }

    async function deleteEmployee(id) {
        if(!confirm(`⚠️ 高危操作：确定要永久抹除工号 [${id}] 的所有痕迹吗？`)) return;
        const res = await apiCall('deleteEmployee', { id: id });
        if(res.status === 'success') { 
            alert("✅ 档案已粉碎"); 
            closeModal();
            await loadEmployees(); 
        } else { alert("❌ 删除失败: " + res.msg); }
    }

    /* ====== 主题与全局配色设置 ====== */
    function loadUserTheme() {
        const saved = localStorage.getItem(`theme_${currentUser.email}`);
        if(saved) applyCustomTheme(JSON.parse(saved));
    }
    
    function applyCustomTheme(theme) {
        const root = document.documentElement;
        if(theme.titleColor) root.style.setProperty('--title-color', theme.titleColor);
        if(theme.primary) root.style.setProperty('--primary-glow', theme.primary);
        
        const titleText = theme.title || "MATRIX OS · 全息指挥中枢";
        document.getElementById('mainTitle').innerText = titleText;
        document.title = titleText;
        
        document.getElementById('customTitleColor').value = theme.titleColor || "#00f0ff";
        document.getElementById('customPrimary').value = theme.primary || "#00f0ff";
        document.getElementById('customTitle').value = titleText;
    }
    
    function setThemePreset(type) {
        if (type === 'light') document.body.classList.add('theme-light');
        else document.body.classList.remove('theme-light');
    }

    document.getElementById('saveSettingsBtn').onclick = () => {
        const theme = {
            titleColor: document.getElementById('customTitleColor').value,
            primary: document.getElementById('customPrimary').value,
            title: document.getElementById('customTitle').value
        };
        localStorage.setItem(`theme_${currentUser.email}`, JSON.stringify(theme));
        applyCustomTheme(theme);
        document.getElementById('settingsOverlay').style.display = 'none';
    };

    /* ====== 辅助工具 ====== */
    function clearForm() { 
        document.querySelectorAll('#editorForm input, #editorForm textarea').forEach(i=>i.value=''); 
        document.getElementById('f_gender').value = '男';
        document.getElementById('f_shift').value = 'A班';
    }
    function togglePanel(id) { document.getElementById(id).classList.toggle(id==='leftPanel'?'hidden-left':'hidden-right'); }
    function closeModal() { document.getElementById('holoModal').style.display = 'none'; }
    function openSettings() { document.getElementById('settingsOverlay').style.display = 'flex'; }
    
    // 初始化事件绑定
    document.getElementById('navStaffBtn').onclick = resetToFullView;
    document.getElementById('confirmWriteBtn').onclick = confirmWrite;
    document.getElementById('verifyLoginBtn').onclick = verifyLogin;
    
    // 模态框初始化
    const modalDiv = document.createElement('div');
    modalDiv.id = 'holoModal';
    modalDiv.className = 'holo-overlay';
    modalDiv.onclick = (e) => { if(e.target === modalDiv) closeModal(); };
    modalDiv.innerHTML = '<div class="holo-dialog dynamic-border" id="modalContent"></div>';
    document.body.appendChild(modalDiv);
</script>
</body>
</html>
